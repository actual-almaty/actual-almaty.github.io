<title>ACTUAL · Руководитель</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1EC; --surface:#FFFFFF; --ink:#141414; --ink2:#3A3733; --muted:#857E74;
  --line:#E6E0D6; --sand:#B79A6B; --sand-soft:#EFE7DA; --green:#2F6B4F; --red:#A8432F;
  --radius:14px; --serif:'Cormorant Garamond',Georgia,serif; --sans:'Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:232px;background:var(--ink);color:#EDE8DF;padding:28px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.brand{font-family:var(--serif);font-size:30px;letter-spacing:.32em;font-weight:600;padding:0 10px}
.brand-sub{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#9C958A;padding:2px 10px 26px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;text-decoration:none;color:#CFC8BC;font-weight:500;font-size:14px}
.nav a svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}
.nav a.on{background:#25231F;color:#fff}
.nav a.on svg{stroke:var(--sand)}
.side-foot{margin-top:auto;font-size:12px;color:#8C857A;padding:0 10px;line-height:1.5}
/* main */
main{flex:1;min-width:0;padding:30px 36px 60px;max-width:1240px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font-family:var(--serif);font-weight:600;font-size:38px;margin:0;line-height:1}
.hello{color:var(--muted);font-size:13px;margin-bottom:6px;letter-spacing:.04em}
.seg{display:inline-flex;max-width:100%;overflow-x:auto;scrollbar-width:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:nowrap}
.seg button{flex-shrink:0;white-space:nowrap;border:0;background:none;padding:7px 14px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--ink2);font-weight:500}
.seg button.on{background:var(--ink);color:#fff}
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(4,1fr)}
.k3{grid-template-columns:repeat(3,1fr)}
.k2{grid-template-columns:1.4fr 1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;min-width:0}
.card h3{margin:0 0 14px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi .lbl{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.kpi .val{font-family:var(--serif);font-size:34px;font-weight:600;margin:8px 0 4px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .sub{font-size:12.5px;color:var(--muted)}
.delta{font-weight:600;font-size:12.5px}
.up{color:var(--green)} .down{color:var(--red)}
.mt{margin-top:14px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.45}
.dark{background:var(--ink);color:#F3EEE6;border-color:var(--ink)}
.dark .lbl,.dark .sub{color:#A39C91}
.bar{height:6px;background:var(--sand-soft);border-radius:999px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--sand);border-radius:999px}
.dark .bar{background:#2E2B27}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .nm{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rt{text-align:right;font-size:13px;white-space:nowrap}
.row .rank{width:22px;color:var(--muted);font-size:12px}
.row .nm.wrap{white-space:normal}
.mini{height:3px;background:var(--sand-soft);border-radius:2px;margin-top:5px}
.mini i{display:block;height:100%;background:var(--sand);border-radius:2px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}
.tbl{overflow-x:auto}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.sand{background:var(--sand);border-color:var(--sand)}
.icon-btn{border:0;background:none;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:6px;font-size:13px}
.icon-btn:hover{background:var(--sand-soft);color:var(--ink)}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--sand-soft);color:#6D5A3A}
.pill.red{background:#F5E1DB;color:var(--red)}
.pill.green{background:#DDEBE3;color:var(--green)}
.empty{padding:22px 4px;color:var(--muted);font-size:13.5px;text-align:center;line-height:1.5}

<script>
async function scryptKey(pass, salt, N, r, p, dkLen) {
  var enc = new TextEncoder();

    for (var i = 0; i < 16; i++) x[i] = B16[i];

      var u;

      u = x[8] + x[4]; x[12] ^= (u << 13) | (u >>> 19); u = x[12] + x[8]; x[0] ^= (u << 18) | (u >>> 14);
      u = x[5] + x[1]; x[9] ^= (u << 7) | (u >>> 25); u = x[9] + x[5]; x[13] ^= (u << 9) | (u >>> 23);
      u = x[13] + x[9]; x[1] ^= (u << 13) | (u >>> 19); u = x[1] + x[13]; x[5] ^= (u << 18) | (u >>> 14);
      u = x[10] + x[6]; x[14] ^= (u << 7) | (u >>> 25); u = x[14] + x[10]; x[2] ^= (u << 9) | (u >>> 23);
      u = x[2] + x[14]; x[6] ^= (u << 13) | (u >>> 19); u = x[6] + x[2]; x[10] ^= (u << 18) | (u >>> 14);
      u = x[15] + x[11]; x[3] ^= (u << 7) | (u >>> 25); u = x[3] + x[15]; x[7] ^= (u << 9) | (u >>> 23);
      u = x[7] + x[3]; x[11] ^= (u << 13) | (u >>> 19); u = x[11] + x[7]; x[15] ^= (u << 18) | (u >>> 14);
      u = x[0] + x[3]; x[1] ^= (u << 7) | (u >>> 25); u = x[1] + x[0]; x[2] ^= (u << 9) | (u >>> 23);
      u = x[2] + x[1]; x[3] ^= (u << 13) | (u >>> 19); u = x[3] + x[2]; x[0] ^= (u << 18) | (u >>> 14);
      u = x[5] + x[4]; x[6] ^= (u << 7) | (u >>> 25); u = x[6] + x[5]; x[7] ^= (u << 9) | (u >>> 23);
      u = x[7] + x[6]; x[4] ^= (u << 13) | (u >>> 19); u = x[4] + x[7]; x[5] ^= (u << 18) | (u >>> 14);
      u = x[10] + x[9]; x[11] ^= (u << 7) | (u >>> 25); u = x[11] + x[10]; x[8] ^= (u << 9) | (u >>> 23);
      u = x[8] + x[11]; x[9] ^= (u << 13) | (u >>> 19); u = x[9] + x[8]; x[10] ^= (u << 18) | (u >>> 14);
      u = x[15] + x[14]; x[12] ^= (u << 7) | (u >>> 25); u = x[12] + x[15]; x[13] ^= (u << 9) | (u >>> 23);
      u = x[13] + x[12]; x[14] ^= (u << 13) | (u >>> 19); u = x[14] + x[13]; x[15] ^= (u << 18) | (u >>> 14);
    }
    for (i = 0; i < 16; i++) B16[i] = (B16[i] + x[i]) >>> 0;
  }
  function blockMix() { // X -> X, через Y
    for (var k = 0; k < 16; k++) T[k] = X[(2 * r - 1) * 16 + k];
    for (var i = 0; i < 2 * r; i++) {
      for (k = 0; k < 16; k++) T[k] ^= X[i * 16 + k];
      salsa(T);
      var off = (i & 1) ? (r + (i >> 1)) * 16 : (i >> 1) * 16;
      for (k = 0; k < 16; k++) Y[off + k] = T[k];
    }
    X.set(Y);
  }
  var dv = new DataView(B.buffer);
  for (var pi = 0; pi < p; pi++) {
    var base = pi * 128 * r;
    for (var i = 0; i < R32; i++) X[i] = dv.getUint32(base + i * 4, true);
    for (i = 0; i < N; i++) { V.set(X, i * R32); blockMix(); }
    for (i = 0; i < N; i++) {
      var j = X[(2 * r - 1) * 16] & (N - 1);
      for (var k = 0; k < R32; k++) X[k] ^= V[j * R32 + k];

function b64(s){ return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)}); }
function hex(u){ return Array.from(u,function(b){return b.toString(16).padStart(2,"0")}).join(""); }
function unhex(h){ var u=new Uint8Array(h.length/2); for(var i=0;i<u.length;i++) u[i]=parseInt(h.substr(i*2,2),16); return u; }

      var users=await fetch("../team/d/users.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()});

var q=[], qt=null, mem={};
function flush(){ qt=null; var batch=q.splice(0,25); if(q.length) qt=setTimeout(flush,0);
  post("paloma",{calls:batch.map(function(x){return {tool:x.tool,args:x.args,ttl:x.ttl}})}).then(function(j){
    batch.forEach(function(x,i){ var r=j&&j.ok&&j.results?j.results[i]:null;
      if(r&&r.ok&&r.payload&&r.payload.success===false) x.rej({code:r.payload.reason||"tool_error",message:r.payload.message||"Paloma не вернула данные"});
      else if(r&&r.ok){ mem[x.k]={t:Date.now(),payload:r.payload}; x.res({payload:r.payload}); }
      else x.rej({code:(r&&r.error)||(j&&j.error)||"unavailable",message:(r&&r.detail)||(j&&j.error)||"Paloma недоступна"}); });
  }).catch(function(){ batch.forEach(function(x){x.rej({code:"unavailable",message:"Нет соединения"})}) });
}
function callTool(srv,tool,args,opt){
  var c=(opt&&opt.cache)||{}, k=tool+JSON.stringify(args||{}), st=c.staleTime||0, m=mem[k];
  if(m&&!c.refresh&&Date.now()-m.t<st) return Promise.resolve({payload:m.payload});
  var ttl=c.refresh?0:Math.min(21600,Math.round(st/1000));
  return new Promise(function(res,rej){ q.push({tool:tool,args:args||{},ttl:ttl,k:k,res:res,rej:rej}); if(!qt) qt=setTimeout(flush,40); });
}
function watchTool(srv,tool,args,cb,opt){
  var dead=false, run=function(force){ callTool(srv,tool,args,force?{cache:{refresh:true}}:opt).then(function(r){ if(!dead) cb({type:"data",result:{payload:r.payload,cache:{storedAt:Date.now()}}}) },function(e){ if(!dead) cb({type:"error",error:e}) }) };
  run(false); var iv=opt&&opt.refetchInterval?setInterval(function(){run(true)},opt.refetchInterval):null;
  return function(){dead=true; if(iv) clearInterval(iv)};
}
var MCP={callTool:callTool,watchTool:watchTool,__retry:true};

var docs={}, loaded=false, colL={}, docL={}, wq=[], wt=null;

function notify(path){ var c=path?path.split("/")[0]:null; Object.keys(colL).forEach(function(k){ if(!c||k===c) colL[k].forEach(function(f){f(snapOf(k))}) }); Object.keys(docL).forEach(function(k){ if(!path||k===path) docL[k].forEach(function(f){f(docSnap(k))}) }); }
function loadAll(){ return post("kvGet",{prefix:""}).then(function(j){ if(!j.ok) throw j; var n={}; j.docs.forEach(function(d){ try{n[d[0]]=JSON.parse(d[1])}catch(e){} }); var ch=JSON.stringify(n)!==JSON.stringify(docs); docs=n; loaded=true; if(ch) notify(null); }); }
function wflush(){ wt=null; var b=wq.splice(0); var set=[],del=[]; b.forEach(function(x){ if(x.del) del.push(x.p); else set.push([x.p,JSON.stringify(x.v)]) });
  post("kvSet",{set:set,del:del}).then(function(j){ b.forEach(function(x){ j&&j.ok?x.res():x.rej({code:"unavailable"}) }) }).catch(function(){ b.forEach(function(x){x.rej({code:"unavailable"})}) }); }
function write(p,v,del){ if(del) delete docs[p]; else docs[p]=JSON.parse(JSON.stringify(v)); notify(p); return new Promise(function(res,rej){ wq.push({p:p,v:v,del:del,res:res,rej:rej}); if(!wt) wt=setTimeout(wflush,60); }); }
function docRef(p){ return {id:p.split("/").pop(),path:p,
  set:function(v){return write(p,v,false)}, update:function(v){return write(p,Object.assign({},docs[p]||{},v),false)}, delete:function(){return write(p,null,true)},

/* ========== состояние ========== */
const S = {

/* ========== периоды ========== */
function periodRange(p){
  const t = today();
  if (p === "today") return {from: iso(t), to: iso(t), pf: iso(addDays(t,-7)), pt: iso(addDays(t,-7)), label: "сегодня", cmp: "к этому дню неделю назад"};
  if (p === "yesterday"){ const y = addDays(t,-1); return {from: iso(y), to: iso(y), pf: iso(addDays(y,-7)), pt: iso(addDays(y,-7)), label: "вчера", cmp: "к этому дню неделю назад"}; }
  if (p === "week") return {from: iso(addDays(t,-6)), to: iso(t), pf: iso(addDays(t,-13)), pt: iso(addDays(t,-7)), label: "за 7 дней", cmp: "к прошлым 7 дням"};
  if (p === "30") return {from: iso(addDays(t,-29)), to: iso(t), pf: iso(addDays(t,-59)), pt: iso(addDays(t,-30)), label: "за 30 дней", cmp: "к прошлым 30 дням"};
  // месяц с 1-го числа
  const f = new Date(t.getFullYear(), t.getMonth(), 1, 12);
  const pf = new Date(t.getFullYear(), t.getMonth()-1, 1, 12);
  const lastPrev = new Date(t.getFullYear(), t.getMonth(), 0, 12);
  const pt = new Date(pf.getFullYear(), pf.getMonth(), Math.min(t.getDate(), lastPrev.getDate()), 12);
  return {from: iso(f), to: iso(t), pf: iso(pf), pt: iso(pt), label: "с начала месяца", cmp: "к тому же периоду прошлого месяца"};
}
const PERIODS = [["today","Сегодня"],["yesterday","Вчера"],["week","7 дней"],["month","Месяц"],["30","30 дней"]];

/* ========== Paloma: живые запросы ========== */
const watches = {};
const ERR_TEXT = {
  needs_reauth: "Paloma требует повторного входа: claude.ai → Настройки → Коннекторы → Paloma.",

};
const DENY = ["needs_reauth","server_not_connected","blocked_by_policy","approval_required","not_in_manifest","selection_required","not_granted"];
function errText(e){
  if (!e) return "";
  if (e.code === "tool_error") return "Paloma: " + (e.message || "ошибка запроса");
  return ERR_TEXT[e.code] || ("Не удалось получить данные Paloma (" + e.code + ").");
}
const PKEY = "actual_paloma_v2";
let persistT = null;
function persistPaloma(){
  clearTimeout(persistT);
  persistT = setTimeout(()=>{ try { const d = {}; for (const k in S.paloma) if (S.paloma[k]) d[k] = S.paloma[k]; localStorage.setItem(PKEY, JSON.stringify({t: Date.now(), d})); } catch(e){} }, 1500);
}
function restorePaloma(){
  try { const j = JSON.parse(localStorage.getItem(PKEY) || "null"); if (j && j.d && Date.now() - j.t < 3*24*3600e3){ for (const k in j.d) if (S.paloma[k] === undefined || S.paloma[k] === null) S.paloma[k] = j.d[k]; S.restoredAt = j.t; } } catch(e){}
}
function watch(key, tool, input, opt){
  if (watches[key]) { watches[key](); delete watches[key]; }
  if (!S.mcp) return;
  try {
    watches[key] = S.mcp.watchTool(SRV, tool, input, ev => {
      if (ev.type === "data") {
        S.paloma[key] = ev.result.payload; S.errs[key] = null; persistPaloma();
        const st = ev.result.cache?.storedAt || Date.now();
        if (!S.fresh || st > S.fresh) S.fresh = st;
      } else {
        S.errs[key] = {err: ev.error, tool, input};
        if (DENY.includes(ev.error.code)) S.paloma[key] = undefined;
      }
      scheduleRender();
    }, opt && opt.past ? {cache: {staleTime: 12*3600e3, gcTime: 7*24*3600e3}} : {cache: {staleTime: 2*60e3, gcTime: 24*3600e3}, refetchInterval: 5*60e3});
  } catch(e) { S.errs[key] = {err: {code:"bad_request", message: String(e)}}; }
}
async function retryApproval(key){
  const e = S.errs[key]; if (!e) return;
  try { const r = await S.mcp.callTool(SRV, e.tool, e.input); S.paloma[key] = r.payload; S.errs[key] = null; render(); }
  catch(err){ S.errs[key] = {...e, err}; render(); }
}
function errBox(keys){
  for (const k of keys){
    const e = S.errs[k]; if (!e) continue;
    if (e.err.code === "approval_required") return `<div class="err">Нужно разрешение на чтение Paloma. <button class="btn sm" data-act="approve" data-key="${k}">Разрешить</button></div>`;

  }

}
const sumRows = p => p?.totals || null;
/* Выручка = как в Paloma: по складу (продажи минус возвраты). Сегодняшний день попадает в склад только после закрытия смены,
   поэтому до этого сегодня берётся по чекам (без возвратов) и помечается. */
const isErr = k => !!S.errs[k];
function wOrZero(k){ const w = sumRows(S.paloma[k]); if (w) return w; if (isErr(k)) return {salesum:0, quantity:0, profit:0, costsum:0, __err:true}; return null; }
function todayGap(){ const w = sumRows(S.paloma.d0); if (w && num(w.salesum) > 0) return null; if (!w && !isErr("d0")) return undefined; const r = sumRows(S.paloma.tR); if (r) return r; return isErr("tR") ? null : undefined; }
function netOf(k, inclToday){ const w = wOrZero(k); if (!w) return null; if (!inclToday) return w; const g = todayGap(); if (g === undefined) return null; if (!g) return w;
  return {salesum: num(w.salesum)+num(g.salesum), quantity: num(w.quantity)+num(g.quantity), profit: w.__err ? null : w.profit, costsum: w.__err ? null : w.costsum, partial: true, todayGross: num(g.salesum)}; }
function dayNet(i){ const w = sumRows(S.paloma["d"+i]); if (i === 0){ const g = todayGap(); if (g) return {salesum: num(g.salesum), quantity: num(g.quantity), partial: true}; } return w || (isErr("d"+i) ? {salesum:0, quantity:0} : null); }
function setupWatches(){
  const r = periodRange(S.period);
  watch("rev", "report_sales", {date_from: r.from, date_to: r.to, group_by: "warehouse"});
  watch("revPrev", "report_sales", {date_from: r.pf, date_to: r.pt, group_by: "warehouse"});
  watch("gp", "report_sales", {date_from: r.from, date_to: r.to, group_by: "warehouse", source: "warehouse"});
  watch("gpPrev", "report_sales", {date_from: r.pf, date_to: r.pt, group_by: "warehouse", source: "warehouse"});
  watch("top", "report_sales", {date_from: r.from, date_to: r.to, top: 15});
  watch("items", "report_sales", {date_from: r.from, date_to: r.to, top: 200, source: "warehouse"});
}
function setupFixedWatches(){
  const t = today();
  const m = monthRange(monthKey(t));
  watch("mRev", "report_sales", {date_from: m.from, date_to: m.to, group_by: "warehouse"});
  watch("mGp", "report_sales", {date_from: m.from, date_to: m.to, group_by: "warehouse", source: "warehouse"});
  watch("cash", "report_cash_balance", {date_from: iso(addDays(t,-91)), date_to: iso(t)});
  for (let i = 13; i >= 0; i--){
    const d = iso(addDays(t,-i));
    watch("d"+i, "report_sales", {date_from: d, date_to: d, group_by: "warehouse", source: "warehouse"}, i > 0 ? {past: true} : undefined);
  }
  watch("tR", "report_sales", {date_from: iso(t), date_to: iso(t), group_by: "warehouse"});
  watch("sold30", "report_sales", {date_from: iso(addDays(t,-29)), date_to: iso(t), top: 200, source: "warehouse"});
}
function setupFinanceWatches(){
  const m = monthRange(S.financeMonth);
  watch("fRev", "report_sales", {date_from: m.from, date_to: m.to, group_by: "warehouse"});
  watch("fGp", "report_sales", {date_from: m.from, date_to: m.to, group_by: "warehouse", source: "warehouse"});
}
async function loadStock(force){
  if (!S.mcp || S.stockLoading) return;
  S.stockLoading = true; S.stockErr = null; render();
  try {
    let rows = [], offset = 0;
    for (let page = 0; page < 20; page++){
      const res = await S.mcp.callTool(SRV, "report_stock_remainder", {warehouse_id: 1, limit: 500, offset},
        {cache: force ? {staleTime: 30*60e3, gcTime: 24*3600e3, refresh: true} : {staleTime: 30*60e3, gcTime: 24*3600e3}});
      const p = res.payload || {};
      rows = rows.concat(p.rows || []);
      if (!p.has_more) break;
      offset += 500;
    }
    S.stock = rows;
  } catch(e){ S.stockErr = e; }
  S.stockLoading = false; render();
}

async function loadCatalog(force){
  if (!S.mcp || S.catLoading) return;
  S.catLoading = true; S.catErr = null; S.catDone = 0; render();
  const map = new Map(); const LIM = 100;
  const opt = {cache: force ? {staleTime: 12*3600e3, gcTime: 24*3600e3, refresh: true} : {staleTime: 12*3600e3, gcTime: 24*3600e3}};
  const page = async off => { const r = await S.mcp.callTool(SRV, "list_items", {limit: LIM, offset: off, sort_by: "id", order: "asc"}, opt); return r.payload || {}; };
  try {
    let off = 0, more = true;
    while (more && off < 30000){
      const offs = [0,1,2,3].map(i => off + i*LIM);
      const res = await Promise.all(offs.map(page));
      for (const p of res){ (p.items || []).forEach(it => map.set(Number(it.id), {price: num(it.price), articul: it.articul || "", group: it.group || ""})); }
      more = res.every(p => p.has_more) ; off += 4*LIM;
      S.catDone = map.size; scheduleRender();
    }
    S.catalog = map;
  } catch(e){ S.catErr = e; if (map.size) S.catalog = map; }
  S.catLoading = false; render();
}

/* ========== разбор выручки: по прайсу → скидки → возвраты → итог ========== */
S.bd = {}; S.bdLoading = false;
function daysBetween(f, to){ const out = []; let d = new Date(f+"T12:00:00"); const e = new Date(to+"T12:00:00"); while (d <= e){ out.push(iso(d)); d = addDays(d,1); } return out; }
async function loadBreakdown(){
  if (!S.mcp || S.bdLoading) return;
  const r = periodRange(S.period); const key = r.from+"_"+r.to;
  if (S.bd[key] && S.bd[key].done && Date.now() - S.bd[key].at < 5*60e3) return;
  if (!S.catalog && !S.catLoading) loadCatalog();
  S.bdLoading = true; const td = iso(today());
  const days = daysBetween(r.from, r.to); const res = {};
  const one = async ds => {
    const past = ds < td; const cache = {cache: past ? {staleTime: 24*3600e3, gcTime: 7*24*3600e3} : {staleTime: 3*60e3, gcTime: 24*3600e3}};
    let items = null, w = null;
    try { items = (await S.mcp.callTool(SRV, "report_sales", {date_from: ds, date_to: ds, top: 200}, cache)).payload; } catch(e){}
    try { w = (await S.mcp.callTool(SRV, "report_sales", {date_from: ds, date_to: ds, group_by: "warehouse", source: "warehouse"}, cache)).payload?.totals; } catch(e){}
    res[ds] = {items, w};
  };
  try { for (let i = 0; i < days.length; i += 4) await Promise.all(days.slice(i,i+4).map(one)); } catch(e){}
  S.bd[key] = {days: res, done: true, at: Date.now()}; S.bdLoading = false; render();
}
function breakdown(){
  const r = periodRange(S.period); const b = S.bd[r.from+"_"+r.to]; if (!b) return null;
  let list = 0, sold = 0, net = 0, ret = 0, openToday = false, noPrice = 0;
  for (const [ds, d] of Object.entries(b.days)){
    const tot = num(d.items?.totals?.salesum); sold += tot;
    for (const row of (d.items?.rows || [])){ const c = S.catalog?.get(Number(row.group_id)); const lp = c && c.price > 0 ? c.price * num(row.quantity) : num(row.salesum); if (!c) noPrice++; list += Math.max(lp, num(row.salesum)); }
    const shown = (d.items?.rows || []).reduce((a,x)=>a+num(x.salesum),0); list += Math.max(0, tot - shown);
    const wn = d.w && num(d.w.salesum) > 0 ? num(d.w.salesum) : null;
    if (wn == null && tot > 0){ openToday = true; net += tot; } else { net += wn || 0; ret += Math.max(0, tot - (wn || 0)); }
  }
  return {list, disc: Math.max(0, list - sold), sold, ret, net, openToday, priced: !!S.catalog, noPrice};
}
function breakdownCard(){
  const r = periodRange(S.period); const b = breakdown();
  if (!b){ loadBreakdown(); return `<div class="card mt"><h3>Выручка по шагам · ${r.label}</h3><div class="note">Считаю…</div></div>`; }
  const row = (l, v, cls, note) => `<div class="bdrow ${cls||""}"><span>${l}${note?`<small>${note}</small>`:""}</span><b>${v}</b></div>`;
  return `<div class="card mt"><h3>Выручка по шагам · ${r.label}</h3>
    ${row("Общая сумма по прайсу", b.priced ? money(b.list) : "…", "", b.priced ? "если бы продали без скидок" : "загружаю цены каталога")}
    ${row("− Скидки клиентам", b.priced ? "−"+money(b.disc) : "…", "neg", b.priced && b.list ? Math.round(b.disc/b.list*100)+"% от прайса" : "")}
    ${row("= Продано по чекам", money(b.sold), "sub")}
    ${row("− Возвраты", b.openToday && !b.ret ? "после закрытия смены" : "−"+money(b.ret), "neg", b.openToday ? "сегодняшние возвраты видны после закрытия смены" : "")}
    ${row("= Итог (как в Paloma)", money(b.net), "total")}
    <div class="note">Скидка = цена в каталоге Paloma × количество минус сумма в чеке. Если цену товара меняли после продажи, скидка по нему может быть неточной.</div></div>`;
}

/* ========== база (сотрудники, расходы и т.д.) ========== */
const COLS = ["employees","shifts","expenses","channels","tasks","empSales","attendance","schedule","plans","returnsLog"];
function startDb(){
  if (!S.db){ S.dbState = "off"; render(); return; }
  let got = 0;
  const timer = setTimeout(()=>{ if (S.dbState === "loading"){ S.dbState = "slow"; render(); } }, 10000);
  COLS.forEach(c => {
    S.db.collection(c).onSnapshot(snap => {
      S.data[c] = snap.docs.map(d => ({id: d.id, ...d.data()}));
      if (!snap.metadata.fromCache){ got++; if (got >= COLS.length){ clearTimeout(timer); S.dbState = "ok"; } }
      if (S.dbState === "loading" && got > 0) S.dbState = "ok";
      scheduleRender();
    }, e => { clearTimeout(timer); S.dbState = "err:" + e.code; render(); });
  });
  S.db.doc("settings/goals").onSnapshot(s => { S.data.goals = s.exists ? s.data() : {}; scheduleRender(); }, ()=>{});
}
async function dbSave(col, id, obj){

function curGoals(k){ k = k || monthKey(today()); const g = S.data.goals || {}; return (g.months && g.months[k]) || {}; }
const inMonth = (d, k) => (d || "").slice(0,7) === k;
function empName(id){ return S.data.employees.find(e => e.id === id)?.name || "—"; }
const lastDay = k => monthDays(k).slice(-1)[0];
function empRange(empId, from, to){
  const daily = S.data.empSales.filter(x => x.day && x.employeeId === empId && x.day >= from && x.day <= to);
  const dSum = daily.length ? {sales: daily.reduce((a,x)=>a+num(x.sales),0), returns: daily.reduce((a,x)=>a+num(x.returns),0), shifts: daily.reduce((a,x)=>a+num(x.shifts),0), last: daily.map(x=>x.day).sort().pop(), src: "daily"} : null;
  const k = from.slice(0,7);
  const m = from === k + "-01" ? S.data.empSales.find(x => !x.day && x.employeeId === empId && x.month === k) : null;
  const mTo = m ? (m.to || lastDay(k)) : null;
  if (m && to >= mTo && (!dSum || mTo > dSum.last)) return {sales: num(m.sales), returns: num(m.returns), shifts: num(m.shifts), last: mTo, src: "month"};
  return dSum;
}
function retAdj(empId, from, to){
  let a = 0;
  for (const x of S.data.returnsLog){
    if (x.date < from || x.date > to || x.type !== "Возврат от клиента" || !x.soldBy || x.soldBy === x.processedBy) continue;
    if (x.processedBy === empId) a += num(x.amount);
    if (x.soldBy === empId) a -= num(x.amount);
  }
  return a;
}
function factHoursRange(empId, from, to){
  const td = iso(today()); let h = 0;
  for (let d = new Date(from+"T12:00:00"); iso(d) <= to && iso(d) <= td; d = addDays(d, 1)){
    const ds = iso(d); if (!schedFor(ds.slice(0,7)) && !attOf(empId, ds)) continue;
    const f = dayFact(empId, ds); if (f.worked) h += f.hours;
  }
  return h;
}
function payrollRange(from, to){
  return S.data.employees.map(e => {
    const r = empRange(e.id, from, to);
    const hours = factHoursRange(e.id, from, to), hourPay = hours * num(e.perHour);
    let salaryPart = 0;
    const tdy = iso(today()); for (let d = new Date(from+"T12:00:00"); iso(d) <= to && iso(d) <= tdy; d = addDays(d, 1)){ const ds = iso(d); salaryPart += num(e.salary) / monthDays(ds.slice(0,7)).length; }
    const adj = retAdj(e.id, from, to);
    const sales = (r ? r.sales : 0) + adj, returns = (r ? r.returns : 0) - adj, shifts = r ? r.shifts : 0;
    const pl = planOf(from.slice(0,7));
    let ptd = 0; if (pl && (r || adj)) { const mp = num(pl.monthly?.[e.id]?.total); if (mp && from.slice(0,7) === to.slice(0,7) && from.endsWith("-01") && to === lastDay(from.slice(0,7))) ptd = mp; else for (const [ds, d] of Object.entries(pl.days||{})) if (ds >= from && ds <= to) ptd += num(d.emp?.[e.id]); }
    if (e.active === "Не работает" && num(e.monthPlan) && e.end && from.slice(0,7) === String(e.end).slice(0,7) && (r || adj)) ptd = num(e.monthPlan); // уволенный: бонус только от плана на весь месяц
    let pct = num(e.percent), exec = null;
    if (ptd){ exec = sales / ptd * 100; pct = tierRate(pl, exec); }
    const pctPay = Math.max(0, sales) * pct / 100;
    return {e, shifts, sales, returns, adj, pct, exec, planTo: ptd, repTo: r?.last, retDeduct: 0, pctPay, hours, hourPay, salaryPart, pay: salaryPart + num(e.perShift)*shifts + hourPay + pctPay, fromPaloma: !!r || !!adj};
  }).filter(x => x.e.active !== "Не работает" || x.shifts || x.hours || x.sales || x.adj).sort((a,b)=>b.sales-a.sales);
}
function payroll(k){ return payrollRange(k + "-01", lastDay(k)); }
function expensesFor(k){ return S.data.expenses.filter(x => inMonth(x.date, k)); }

function trendSVG(){
  const pts = []; const t = today();
  for (let i = 13; i >= 0; i--) pts.push({d: addDays(t,-i), v: dayNet(i)?.salesum});
  const max = Math.max(1, ...pts.map(p=>p.v||0));
  const W = 700, H = 210, bw = W/14;
  const bars = pts.map((p,i) => {
    const h = p.v == null ? 0 : Math.max(2, (p.v/max)*(H-50));
    const x = i*bw + 6, y = H-28-h;
    const wk = [0,6].includes(p.d.getDay());
    const last = i === 13;
    return `<g><title>${p.d.getDate()} ${MONTHS_G[p.d.getMonth()]}: ${p.v==null?"загрузка…":money(p.v)}</title>
      <rect x="${x}" y="${p.v==null?H-30:y}" width="${bw-12}" height="${p.v==null?2:h}" rx="4" fill="${last?"#141414":wk?"#B79A6B":"#D9CBB2"}"/>
      ${p.v!=null && (last || p.v===max)?`<text x="${x+(bw-12)/2}" y="${y-6}" text-anchor="middle" font-size="11" fill="#3A3733" font-family="Manrope">${Math.round(p.v/1000)}к</text>`:""}
      <text x="${x+(bw-12)/2}" y="${H-10}" text-anchor="middle" font-size="11" fill="${wk?"#8A6F45":"#857E74"}" font-family="Manrope">${p.d.getDate()}</text></g>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Выручка за 14 дней">${bars}</svg>`;
}

function mdLite(t){
  const lines = esc(t).split("\n"); let out = "", inList = false;
  for (let l of lines){
    l = l.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
    if (/^#{1,4}\s/.test(l)){ if(inList){out+="</ul>";inList=false;} out += `<h4>${l.replace(/^#+\s/,"")}</h4>`; }
    else if (/^\s*([-•*]|\d+\.)\s/.test(l)){ if(!inList){out+="<ul>";inList=true;} out += `<li>${l.replace(/^\s*([-•*]|\d+\.)\s/,"")}</li>`; }
    else if (l.trim()===""){ if(inList){out+="</ul>";inList=false;} }
    else { if(inList){out+="</ul>";inList=false;} out += `<p>${l}</p>`; }
  }
  return out + (inList?"</ul>":"");
}

function factHours(empId, k){
  if (!schedFor(k) && !S.data.attendance.some(a => a.employeeId === empId && inMonth(a.date, k))) return 0;
  const td = iso(today()); let h = 0;
  for (const ds of monthDays(k)){ if (ds > td) break; const f = dayFact(empId, ds); if (f.worked) h += f.hours; }
  return h;
}

const DOW = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const ATT = {ok:"По графику", late:"Опоздал(а)", early:"Ушёл(ла) раньше / отпросился", absent:"Не вышел(ла)", sick:"Больничный", dayoff:"Отгул по согласованию", extra:"Доп. смена / замена"};
const parseHM = t => { const m = String(t||"").match(/(\d{1,2})[:.](\d{2})/); return m ? +m[1]*60 + +m[2] : null; };
function parseShift(t){ const m = String(t||"").match(/(\d{1,2})[:.](\d{2})\s*[–—-]\s*(\d{1,2})[:.](\d{2})/); if (!m) return null; const a = +m[1]*60 + +m[2], b = +m[3]*60 + +m[4]; return b > a ? {start:a, end:b, hours:(b-a)/60} : null; }
const hm = m => `${Math.floor(m/60)}:${pad(m%60)}`;
const shortT = m => m%60 ? hm(m) : String(m/60);
function schedFor(k){ const d = S.data.schedule; return d.find(x => x.id === k) || [...d].filter(x => x.id < k).sort((a,b)=>b.id.localeCompare(a.id))[0] || null; }
function planned(empId, ds){ const w = schedFor(ds.slice(0,7))?.week?.[empId]; if (!w) return ""; const i = (new Date(ds+"T12:00:00").getDay()+6)%7; return w[i] || ""; }
const attOf = (empId, ds) => S.data.attendance.find(a => a.employeeId === empId && a.date === ds);
function dayFact(empId, ds){
  const p = parseShift(planned(empId, ds)), a = attOf(empId, ds);
  if (!a) return {p, st: p ? "ok" : "off", hours: p ? p.hours : 0, worked: !!p, late: 0, early: 0};
  const st = a.status;
  if (["absent","sick","dayoff"].includes(st)) return {p, st, hours: 0, worked: false, late: 0, early: 0, a};
  let b = p?.start, e = p?.end;
  if (a.start && parseHM(a.start) != null) b = parseHM(a.start);
  if (a.end && parseHM(a.end) != null) e = parseHM(a.end);
  if (b == null || e == null || e <= b) return {p, st, hours: 0, worked: st === "extra", late: 0, early: 0, a};
  return {p, st, hours: (e-b)/60, worked: true, late: st==="late" && p ? Math.max(0, b-p.start) : 0, early: st==="early" && p ? Math.max(0, p.end-e) : 0, a, b, e};
}
function monthDays(k){ const [y,m] = k.split("-").map(Number); const n = new Date(y, m, 0).getDate(); return Array.from({length:n}, (_,i) => `${k}-${pad(i+1)}`); }
const tsEmps = () => S.data.employees.filter(e => e.active !== "Не работает").sort((a,b)=>(a.name||"").localeCompare(b.name||"","ru"));
function tsSummary(k){
  const days = monthDays(k), td = iso(today());
  return tsEmps().map(e => {
    const r = {e, planShifts:0, planHours:0, toDatePlan:0, shifts:0, hours:0, lates:0, lateMin:0, early:0, absent:0, sick:0, dayoff:0, extra:0};
    days.forEach(ds => {
      const f = dayFact(e.id, ds);
      if (f.p){ r.planShifts++; r.planHours += f.p.hours; }
      if (ds > td) return;
      if (f.p) r.toDatePlan++;
      if (f.worked){ r.shifts++; r.hours += f.hours; }
      if (f.st === "late"){ r.lates++; r.lateMin += f.late; }
      if (f.st === "early") r.early++;
      if (f.st === "absent") r.absent++;
      if (f.st === "sick") r.sick++;
      if (f.st === "dayoff") r.dayoff++;
      if (f.st === "extra") r.extra++;
    });
    return r;
  });
}

/* ========== импорт отчёта по сотрудникам ========== */
function loadXLSX(){
  if (window.XLSX) return Promise.resolve();
  const load = src => new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = src; sc.onload = () => window.XLSX ? res() : rej(new Error("no XLSX")); sc.onerror = rej; document.head.appendChild(sc); });
  return load("xlsx.mini.min.js").catch(() => load("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"));
}
async function importEmpReport(file){
  if (!S.db){ toast("Загрузка работает, когда приложение открыто в claude.ai"); return; }
  S.uploading = true; S.uploadMsg = null; render();
  try {
    try { await loadXLSX(); } catch(e){ throw new Error("Не загрузился модуль чтения Excel — проверьте интернет и попробуйте ещё раз"); }
    if (!window.XLSX) throw new Error("Не загрузился модуль чтения Excel");
    const wb = XLSX.read(await file.arrayBuffer(), {type: "array"});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1, raw: false, defval: ""});
    // период: ищем «дд.мм.гггг» в первых строках, в любой колонке
    let perTxt = "";
    for (const r of rows.slice(0, 15)){ const t = r.map(c => String(c)).join(" "); if (/\d{2}\.\d{2}\.\d{4}/.test(t) && /(период|с\s+\d{2}\.|по\s+\d{2}\.|отч[её]т)/i.test(t)){ perTxt = t; break; } }
    const all = [...perTxt.matchAll(/(\d{2})\.(\d{2})\.(\d{4})/g)];
    if (!all.length) throw new Error("В файле не найден период отчёта");
    const m = all[0];
    const month = `${m[3]}-${m[2]}`; const fromD = `${m[3]}-${m[2]}-${m[1]}`;
    const to = all.length > 1 ? `${all[all.length-1][3]}-${all[all.length-1][2]}-${all[all.length-1][1]}` : fromD;
    // вид «по дням»: строка «Сотрудник: Имя», под ней даты
    const cellOf = (r, re) => { for (const c of r){ const t = String(c||"").trim(); if (re.test(t)) return t; } return ""; };
    if (rows.some(r => cellOf(r, /^Сотрудник:/i))){
      const H2 = (rows.find(r => r.some(c => String(c).trim() === "Дата")) || []).map(c => String(c).trim().toLowerCase());
      const ci = n => H2.findIndex(h => h.includes(n));
      const cS = ci("общая сумма"), cP = ci("процент"), cR = ci("возврат");
      let cur = null, count = 0, added = 0; const names = new Set();
      for (const r of rows){
        const b = cellOf(r, /^Сотрудник:/i) || cellOf(r, /^\d{1,2}\s+[а-яё]+\s+\d{4}/i);
        const mm = b.match(/^Сотрудник:\s*(.+)$/i);
        if (mm){
          const name = mm[1].trim();
          const nk = x => String(x||"").toLowerCase().replace(/ұ|ү/g,"у").replace(/қ/g,"к").replace(/ә/g,"а").replace(/і/g,"и").replace(/ң/g,"н").replace(/ғ/g,"г").replace(/ө/g,"о").replace(/ё/g,"е").replace(/\s+/g," ").trim();
          let emp = S.data.employees.find(e => nk(e.name) === nk(name));
          if (!emp){ const ref = await S.db.collection("employees").add({name, role: "Стилист-Консультант", phone: "", start: "", salary: 0, perShift: 0, perHour: 390, percent: 3, active: "Работает", updatedAt: Date.now()}); emp = {id: ref.id, name}; added++; }
          cur = emp; continue;
        }
        const dm = b.match(/^(\d{1,2})\s+([а-яё]+)\s+(\d{4})/i);
        if (!cur || !dm) continue;
        const mi = MONTHS_G.indexOf(dm[2].toLowerCase()); if (mi < 0) continue;
        const ds = `${dm[3]}-${pad(mi+1)}-${pad(+dm[1])}`;
        await S.db.collection("empSales").doc(`d_${ds}_${cur.id}`).set({day: ds, month: ds.slice(0,7), employeeId: cur.id, name: cur.name, sales: num(r[cS]), percentPay: cP>=0 ? num(r[cP]) : null, returns: cR>=0 ? num(r[cR]) : 0, shifts: 1, to: ds, source: "Paloma: " + file.name, updatedAt: Date.now()});
        count++; names.add(cur.name);
      }
      if (!count) throw new Error("В файле не найдено ни одной строки с датой");
      if (to){ S.teamFrom = fromD; S.teamTo = to; }
      S.uploadMsg = {ok: true, text: `Загружено по дням: ${names.size} сотрудников, ${count} записей (${fmtDate(fromD)} — ${fmtDate(to||fromD)})${added?`, новых: ${added}`:""}`};
      toast("Отчёт загружен");
      S.uploading = false; render(); return;
    }
    const hi = rows.findIndex(r => r.some(c => String(c).trim() === "Сотрудник"));
    if (hi < 0) throw new Error("Это не «Отчёт по сотрудникам»");
    const H = rows[hi].map(c => String(c).trim().toLowerCase());
    const col = name => H.findIndex(h => h.includes(name));
    const cN = col("сотрудник"), cS = col("общая сумма"), cP = col("процент"), cR = col("возврат"), cSh = col("смен");
    let count = 0, added = 0;
    for (const r of rows.slice(hi+1)){
      const name = String(r[cN] || "").trim();
      if (!name || /^итого/i.test(String(r[0])) || /^итого/i.test(name)) continue;
      let emp = S.data.employees.find(e => (e.name||"").trim().toLowerCase() === name.toLowerCase());
      let empId = emp?.id;
      if (!emp){
        const ref = await S.db.collection("employees").add({name, role: "Продавец-консультант", phone: "", start: "", salary: 0, perShift: 0, percent: 3, active: "Работает", updatedAt: Date.now()});
        empId = ref.id; added++;
      }
      const isDay = to && to === fromD;
      await S.db.collection("empSales").doc(isDay ? `d_${fromD}_${empId}` : month + "_" + empId).set({day: isDay ? fromD : null, month, employeeId: empId, name, sales: num(r[cS]), percentPay: cP>=0 ? num(r[cP]) : null, returns: cR>=0 ? num(r[cR]) : 0, shifts: cSh>=0 ? num(r[cSh]) : 0, to, source: "Paloma: " + file.name, updatedAt: Date.now()});
      count++;
    }
    if (to){ S.teamFrom = fromD; S.teamTo = to; }
    if (!count) throw new Error("В файле не найдено ни одного сотрудника");
    S.uploadMsg = {ok: true, text: `Загружено: ${count} сотрудников за ${to && to!==fromD ? fmtDate(fromD)+" — "+fmtDate(to) : fmtDate(fromD)}${added?`, новых: ${added}`:""}`};
    toast(`Загружено: ${count} сотрудников за ${to && to!==fromD ? fmtDate(fromD)+" — "+fmtDate(to) : fmtDate(fromD)}${added?`, новых: ${added}`:""}`);
  } catch(e){ const t = e && e.message && e.message.length < 120 ? e.message : "Не удалось прочитать файл (" + (e?.code || "ошибка") + ")"; S.uploadMsg = {ok: false, text: t}; toast(t); }
  S.uploading = false; render();
}

/* ========== события ========== */
document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  if (a === "period"){ S.period = el.dataset.p; setupWatches(); render(); }
  else if (a === "form"){ ev.preventDefault(); openForm(el.dataset.col, el.dataset.id); }
  else if (a === "close") closeModal();
  else if (a === "del"){
    if (confirmDel !== el.dataset.id){ confirmDel = el.dataset.id; el.textContent = "Точно удалить?"; return; }
    confirmDel = null; await dbDel(el.dataset.col, el.dataset.id); closeModal();
  }
  else if (a === "task"){
    const t = S.data.tasks.find(x=>x.id===el.dataset.id); if (!t) return;
    const {id, ...rest} = t; await dbSave("tasks", id, {...rest, done: el.checked ? "Да" : "Нет", updatedAt: Date.now()});
  }
  else if (a === "approve") retryApproval(el.dataset.key);
  else if (a === "att") openAtt(el.dataset.e, el.dataset.d);
  else if (a === "day") openDay(el.dataset.d);
  else if (a === "pickfile"){ const fi = $("#empFile"); fi.value = ""; fi.click(); }
  else if (a === "trange"){ S.teamFrom = el.dataset.f; S.teamTo = el.dataset.t; render(); }
  else if (a === "copymsg"){ try { await navigator.clipboard.writeText($("#dayMsg").textContent); toast("Скопировано — вставьте в чат"); } catch(e){ const r = document.createRange(); r.selectNodeContents($("#dayMsg")); const sl = getSelection(); sl.removeAllRanges(); sl.addRange(r); toast("Выделено — нажмите «Копировать»"); } }
  else if (a === "sched") openSched();
  else if (a === "ssort"){ S.salesSort = el.dataset.s; render(); }
  else if (a === "sfilter"){ S.stockFilter = el.dataset.f; render(); }
  else if (a === "lowfilter"){ S.stockFilter = "low"; }
  else if (a === "stockreload"){ loadStock(true); loadCatalog(true); }
  else if (a === "ai") askAI("");
  else if (a === "aiq") askAI(el.dataset.q);
});
document.addEventListener("input", ev => {
  if (ev.target.id === "aiQ") S.aiDraft = ev.target.value;
  if (ev.target.id === "stockQ"){ S.stockQ = ev.target.value; clearTimeout(S._sq); S._sq = setTimeout(render, 200); }
});
document.addEventListener("change", ev => {
  const a = ev.target.dataset.act; if (!a || !ev.target.value) return;
  if (a === "finmonth"){ S.financeMonth = ev.target.value; setupFinanceWatches(); render(); }
  if (a === "chmonth"){ S.channelMonth = ev.target.value; render(); }
  if (a === "planmonth"){ S.planMonth = ev.target.value; render(); }
  if (a === "tfrom"){ S.teamFrom = ev.target.value; if (S.teamTo < S.teamFrom) S.teamTo = S.teamFrom; render(); }
  if (a === "tto"){ S.teamTo = ev.target.value; if (S.teamTo < S.teamFrom) S.teamFrom = S.teamTo; render(); }
  if (a === "teammonth"){ S.teamMonth = ev.target.value; render(); }
});
document.addEventListener("submit", ev => {
  if (ev.target.id === "aiForm"){ ev.preventDefault(); const q = $("#aiQ").value.trim(); if (q) askAI(q); }
});
$("#empFile").addEventListener("change", ev => { const f = ev.target.files && ev.target.files[0]; if (f) importEmpReport(f); });
$("#modalBg").addEventListener("click", ev => { if (ev.target.id === "modalBg") closeModal(); });
function route(){ const h = location.hash.replace("#",""); S.view = VIEWS.some(v=>v[0]===h) ? h : "home"; render(); window.scrollTo(0,0); }
window.addEventListener("hashchange", route);

/* ========== запуск ========== */
route();
(async () => {
  const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(()=>null) : Promise.resolve(null);
  const [mcp, db, sample] = await Promise.all([use("mcp"), use("db"), use("sample")]);
  if (mcp && mcp.callTool && !mcp.__retry) {
    const orig = mcp.callTool.bind(mcp);
    mcp.callTool = async (...a) => {
      let last;
      for (let i = 0; i < 6; i++) {
        try { return await orig(...a); }
        catch (e) {
          last = e;
          const m = String((e && (e.message || e.code)) || '');
          if (!/busy|rate|timeout|unavailable/i.test(m)) throw e;
          await new Promise(r => setTimeout(r, 2500 * (i + 1)));
        }
      }
      throw last;
    };
    mcp.__retry = true;
  }
  S.mcp = mcp; S.db = db; S.sample = sample;
  restorePaloma();
  if (mcp){ setupWatches(); setTimeout(()=>{ setupFixedWatches(); setupFinanceWatches(); }, 3000); setTimeout(loadStock, 8000); }
  startDb();
  render();
})();

<script>
/* ===== Мотивация продавцам в WhatsApp (руководитель нажимает «Отправить») ===== */
(function(){
var API="https://script.google.com/macros/s/AKfycbyQyJ7kTF21MbcRgo2IaqUFneBRqY0Ahm85K0fr15mbWcWmE0iU91ZDpij6XCcR1WGfsA/exec";
var LOGIN={p00000000:"nuraly",p00000008:"marat",p00000005:"alikhan",p00000004:"aruzhan"};
var SIZ={p00000000:true};
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function m(n){n=Math.round(+n||0);return String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g," ")+" ₸"}
function mln(n){n=+n||0;return Math.abs(n)>=1e6?(n/1e6).toFixed(1).replace(".",",").replace(",0","")+" млн ₸":Math.round(n/1e3)+" мың ₸"}
function almaty(){return new Date(Date.now()+5*3600e3).toISOString().slice(0,10)}
function factOf(id,ym){var ds=S.data.empSales.filter(function(x){return x.employeeId===id&&String(x.id).indexOf("d_"+ym)===0});if(ds.length)return [ds.reduce(function(a,x){return a+(+x.sales||0)},0),ds.map(function(x){return x.day}).sort().pop()];var mo=S.data.empSales.filter(function(x){return x.employeeId===id&&x.id===ym+"_"+id})[0];return [mo?+mo.sales||0:0,mo?mo.to:""]}
function textFor(e,tasks){
  var td=almaty(), ym=td.slice(0,7), pl=(S.data.plans||[]).filter(function(x){return x.id===ym})[0]||{};
  var plan=+(((pl.monthly||{})[e.id]||{}).total)||0, today=+((((pl.days||{})[td]||{}).emp||{})[e.id])||0;
  var f=factOf(e.id,ym), fact=f[0], left=Math.max(0,plan-fact);
  var y=+ym.slice(0,4),mo=+ym.slice(5,7),dim=new Date(Date.UTC(y,mo,0)).getUTCDate(),dl=dim-+td.slice(8,10)+1;
  var pct=plan?Math.round(fact/plan*100):0, siz=!!SIZ[e.id], nm=e.name;
  var L=[];
  var hr=new Date(Date.now()+5*3600e3).getUTCHours(), g=hr<12?"Қайырлы таң":hr<18?"Қайырлы күн":"Қайырлы кеш", gi=hr<12?" ☀️":hr<18?" 🌿":" 🌙";
  L.push(pick(siz?[g+", "+nm+" аға!"+gi,"Сәлеметсіз бе, "+nm+" аға! 🌿"]:[g+", "+nm+"!"+gi,"Сәлем, "+nm+"! 👋","Қалайсың, "+nm+"? ✨"]));
  if(today) L.push((siz?"Бүгінгі жоспарыңыз: ":"Бүгінгі жоспарың: ")+m(today)+" 🎯");
  if(plan){
    L.push((siz?"Айлық жоспарыңыз ":"Айлық жоспарың ")+mln(plan)+", қазір "+pct+"% орындалды"+(f[1]?" ("+f[1].slice(8,10)+"."+f[1].slice(5,7)+" дейін)":"")+".");
    if(left>0) L.push("Жоспарға "+mln(left)+" қалды, күніне шамамен "+mln(left/Math.max(1,dl))+" 💪");
    else L.push(siz?"Айлық жоспар орындалды, керемет! 🏆":"Айлық жоспар орындалды, сен кереметсің! 🏆");
  }
  var open=tasks.filter(function(t){return t.status==="new"||t.status==="returned"});
  if(open.length) L.push((siz?"Тапсырмаларыңыз:\n":"Тапсырмаларың:\n")+open.slice(0,5).map(function(t){return "• "+t.title.replace(/^🔴\s*/,"🔴 ")}).join("\n"));
  var hot=pct>=100?(siz?["Сіз бәрімізге үлгісіз, рақмет! 🙏","Керемет нәтиже, осылай жалғастырайық! 🚀"]:["Сен бәрімізге үлгісің, рақмет! 🙏","Керемет нәтиже, осылай жалғастыр! 🚀"]):pct>=70?(siz?["Бонусқа жақынсыз, тағы аздап! 🔥","Жақсы қарқын, тоқтамайық! 🔥"]:["Бонусқа жақынсың, тағы аздап! 🔥","Жақсы қарқын, тоқтама! 🔥"]):(siz?["Сізге сенемін, бүгін керемет күн болады! 💫","Әр клиент маңызды, бәрі қолыңыздан келеді! 💫"]:["Саған сенемін, сен істей аласың! 💫","Бүгін рекорд күн болсын, алға! 💫","Әр клиент — мүмкіндік, сен мықтысың! 💫"]);
  L.push(pick(hot));
  L.push(siz?"⚠️ Тапсырмаларды міндетті түрде орындап, қосымшада фотоотчёт жіберіп, белгілеңіз. Фотосыз тапсырма есептелмейді.":"⚠️ Тапсырмаларды міндетті түрде орындап, қосымшада фотоотчёт жіберіп, белгіле. Фотосыз тапсырма есептелмейді.");
  L.push("📲 https://actual-almaty.github.io/team/");
  L.push("Жанерке");
  return L.join("\n");
}
function openMotiv(){
