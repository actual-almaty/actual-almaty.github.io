    var txt="Сверка от "+who+":\n"+it.item_name+"\nВ Paloma: "+it.system_qty+" шт\nФактически: "+it.fact_qty+" шт"+(d?" (разница "+(d>0?"+":"")+d+")":" ✅")+(it.note?"\nКомментарий: "+it.note:"");
    window.open("https://wa.me/"+SHOP_WA+"?text="+encodeURIComponent(txt),"_blank");
    return Promise.resolve({ok:true});
  }
  if(action==="upload") return tasksApi("uploadSales",payload).then(function(j){return j.ok?j:{ok:false,error:j.error==="net"?"net":(j.error||"")}});
  if(action==="setpass"||action==="setplan") return Promise.resolve({ok:false,error:"пока меняется через Claude — отправьте ему"});
  return (async function(){
    try{
      if(action==="login"){
        var login=String(payload.login||"").trim().toLowerCase(), users=await getJSON("users.json"), salt=users[login];
        var key=await scryptKey(String(payload.password||""), salt||"no-such-user", 16384, 8, 1, 32);
        if(!salt) return {ok:false,error:"wrong"};
        var box=await getJSON(login+".json"), m;
        try{ m=await aesOpen(key,box); }catch(e){ return {ok:false,error:"wrong"}; }
        MINE=m; return {ok:true, token:JSON.stringify({l:login,k:hex(key)}), name:m.body.me.name, role:m.body.me.role};
      }
      if(action==="boot"){ MINE=null; var m2=await openMine(); var meta={}; try{ meta=await getJSON("stock-meta.json"); }catch(e){} var body=JSON.parse(JSON.stringify(m2.body)); body.stockVersion=meta.version||""; body.qtyVersion=""; try{ var sj=await tasksApi("sales"); if(sj.ok) mergeSales(body,sj.rows); }catch(e){} return body; }
      if(action==="stock") return await openStock();
      if(action==="qty"){ var mt=await getJSON("stock-meta.json"); if(S.stock && mt.version && mt.version!==S.stock.version) loadStock(); return {ok:false}; }
      if(action==="refresh"){ var st=await openStock(); S.stock={version:st.version,synced:st.synced,rows:st.rows}; LS.set("at_stock",S.stock); idx=null; return {ok:true,version:"",qty:{}}; }

}

/* ---------- stock ---------- */
var idx=null;
var SIZES={XS:1,S:1,M:1,L:1,XL:1,XXL:1,"2XL":1,"3XL":1,XXXL:1,"4XL":1,"5XL":1};
function norm(s){return String(s).toLowerCase().replace(/ё/g,"е").replace(/[мm]/g,"m").replace(/\s+/g," ").trim()}
function lat(s){return s.replace(/[а-я]/g,function(c){var m={"а":"a","в":"b","е":"e","к":"k","м":"m","н":"h","о":"o","р":"p","с":"c","т":"t","х":"x","у":"y"};return m[c]||c})}
function buildIdx(){
  var rows=(S.stock&&S.stock.rows)||[]; var groups={}; var list=[]; var Q=(S.qty&&S.stock&&S.qty.version>S.stock.synced)?S.qty.qty:null;
  rows.forEach(function(r){
    var name=r[1], tok=name.split(" "), size="", base=name;
    var last=tok[tok.length-1], lu=last.toUpperCase();
    if(SIZES[lu]){size=lu;base=tok.slice(0,-1).join(" ")}
    else if(/^\d{2}(\.5)?$/.test(last)&&tok.length>2){size=last;base=tok.slice(0,-1).join(" ")}
    else { for(var i=tok.length-2;i>0;i--){var u=tok[i].toUpperCase();if(SIZES[u]){size=u;base=tok.slice(0,i).concat(tok.slice(i+1)).join(" ");break}} }
    var g=groups[base]; if(!g){g=groups[base]={base:base,items:[],qty:0,price:0,key:lat(norm(base))+" "+norm(base)};list.push(g)}
    var qn=Q?(Q[r[0]]||0):r[2]; g.items.push({id:r[0],name:name,qty:qn,price:r[3],bc:r[4]||"",size:size||"—"}); g.qty+=Math.max(0,qn); if(r[3]>g.price)g.price=r[3]; g.key+=" "+(r[4]||"")+" "+r[0];
  });
  var ord=["XS","S","M","L","XL","XXL","2XL","3XL","XXXL","4XL","5XL"];
  list.forEach(function(g){g.items.sort(function(a,b){var ia=ord.indexOf(a.size),ib=ord.indexOf(b.size);if(ia>=0&&ib>=0)return ia-ib;var na=parseFloat(a.size),nb=parseFloat(b.size);if(!isNaN(na)&&!isNaN(nb))return na-nb;return a.name<b.name?-1:1})});
  idx=list;
}
function searchStock(q){

  var res=[];
  for(var i=0;i<idx.length&&res.length<80;i++){var g=idx[i];var ok=true;for(var k=0;k<words.length;k++){if(g.key.indexOf(words[k][0])<0&&g.key.indexOf(words[k][1])<0){ok=false;break}}if(ok&&(!S.onlyStock||g.qty>0))res.push(g)}
  res.sort(function(a,b){return (b.qty>0)-(a.qty>0)});
  return res;
}

  $("#view").innerHTML=h; bindTasks();
  document.querySelectorAll(".chip[data-d]").forEach(function(c){c.onclick=function(){S.tDate=c.dataset.d;renderTasksAdmin()}});
  $("#tdp").onchange=function(e){if(e.target.value){S.tDate=e.target.value;renderTasksAdmin()}};
  $("#tn").onclick=function(){openCreate([[team()[0]?team()[0].login:"","",""]])};
  $("#tcl").onclick=function(){openCreate(CLEAN.map(function(c){return c.slice()}))};
  $("#trf").onclick=function(){S.tasks=null;renderTasks()};
}
function openCreate(rows){
  var opts=function(sel){return team().map(function(e){return '<option value="'+e.login+'"'+(e.login===sel?" selected":"")+'>'+esc(e.name)+'</option>'}).join("")};
  var row=function(r,i){return '<div class="card cr" style="padding:12px"><div class="row"><select class="cs">'+opts(r[0])+'<option value="">— не ставить —</option></select><button class="x" data-del="'+i+'" style="margin:0">×</button></div><input class="ct" placeholder="Задача" value="'+esc(r[1])+'"><textarea class="cn" rows="2" placeholder="Подробно (необязательно)">'+esc(r[2])+'</textarea><input class="cb" inputmode="numeric" placeholder="Бонус, ₸ (необязательно)" value="'+(r[3]||"")+'"></div>'};
  var s=sheetOpen('<h3>Новые задачи</h3><div class="small muted">на '+dayLabel(S.tDate)+'</div><div id="crs"></div><button class="btn ghost" id="cadd">+ Ещё строка</button><div class="err" id="ce"></div><button class="btn" id="csv">Поставить задачи</button>');
  var read=function(){return [].map.call(s.el.querySelectorAll(".cr"),function(c){return [c.querySelector(".cs").value,c.querySelector(".ct").value,c.querySelector(".cn").value,c.querySelector(".cb").value.replace(/\D/g,"")]})};
  var draw=function(){var b=s.el.querySelector("#crs");b.innerHTML=rows.map(row).join("");b.querySelectorAll("[data-del]").forEach(function(x){x.onclick=function(){rows=read();rows.splice(+x.dataset.del,1);draw()}})};
  draw();
  s.el.querySelector("#cadd").onclick=function(){rows=read();rows.push(["","","",""]);draw()};
  s.el.querySelector("#csv").onclick=function(){
    var items=read().filter(function(r){return r[0]&&r[1].trim()}).map(function(r){return {login:r[0],title:r[1].trim(),note:r[2].trim(),bonus:+r[3]||0}});
    if(!items.length){s.el.querySelector("#ce").textContent="Выберите сотрудника и напишите задачу";return}
    var b=this;b.disabled=true;b.innerHTML='<span class="spin"></span>';
    tasksApi("create",{date:S.tDate,items:items}).then(function(j){if(j.ok){S.tasks=S.tasks.concat(j.tasks);s.close();toast("Поставлено задач: "+j.tasks.length+" ✅");renderTasks()}else{b.disabled=false;b.textContent="Поставить задачи";s.el.querySelector("#ce").textContent=tErr(j.error)}});
  };
}

/* ---------- admin ---------- */
function renderAdmin(){
  var b=S.boot, cur=ymNow(); var months=[cur,ymPrev(cur)];
  if(!S.month||months.indexOf(S.month)<0) S.month=cur;
  var h='<h1>Команда</h1><div class="muted small">Видите только вы, как руководитель</div>';
  h+='<div class="chips">'+months.map(function(m){return '<button class="chip '+(m===S.month?"on":"")+'" data-m="'+m+'">'+monthName(m)[0].toUpperCase()+monthName(m).slice(1)+'</button>'}).join("")+'</div>';
  var tot=0,totPlan=0,gr=0,rt=0;
  var rows=(b.team||[]).map(function(e){var s=monthStats(e,S.month,b.tiers);tot+=s.sales;totPlan+=s.plan;gr+=s.gross;rt+=s.ret;return {e:e,s:s}});
  if(S.adminEmp){ var x=rows.filter(function(r){return r.e.emp_id===S.adminEmp})[0]; if(x){ h='<button class="chip" id="bk" style="margin-top:14px">← Вся команда</button><h1>'+esc(x.e.name)+'</h1><div class="chips">'+months.map(function(m){return '<button class="chip '+(m===S.month?"on":"")+'" data-m="'+m+'">'+cap(monthName(m))+'</button>'}).join("")+'</div>'+summaryCard(x.s,monthName(S.month))+(x.s.plan?'<div class="card"><div class="row"><span class="kicker">Бонус сейчас</span><span><b>'+money(x.s.bonus)+'</b> <span class="tier t'+x.s.rate+'">'+x.s.rate+'%</span></span></div></div>':'')+daysBlock(x.s); $("#view").innerHTML=h; $("#bk").onclick=function(){S.adminEmp=null;renderAdmin();scrollTo(0,0)}; document.querySelectorAll(".chip[data-m]").forEach(function(c){c.onclick=function(){S.month=c.dataset.m;renderAdmin()}}); return; } S.adminEmp=null; }
  h+=summaryCard({sales:tot,gross:gr,ret:rt,plan:totPlan,pct:totPlan?tot/totPlan*100:null,days:rows.length?[1]:[]}, monthName(S.month), true).replace('Итог за','Магазин, итог за').replace(/<div class="small" style="color:#9a9286[^<]*<\/div>/,'');
  h+='<div class="list">'+rows.map(function(x){var s=x.s;return '<div class="li" data-e="'+esc(x.e.emp_id)+'" style="cursor:pointer"><div><b>'+esc(x.e.name)+'</b><div class="small muted">'+(s.plan?"план "+short(s.plan):"без плана")+(s.ret?" · возвраты "+short(s.ret):"")+(s.last?" · до "+s.last.slice(8,10)+"."+s.last.slice(5,7):"")+'</div></div><div class="r"><b>'+money(s.sales)+'</b><div class="small">'+(s.plan?Math.round(s.pct)+'% <span class="tier t'+s.rate+'">'+s.rate+'%</span>':"")+' ›</div></div></div>'}).join("")+'</div><div class="small muted" style="margin:0 2px">Нажмите на сотрудника, чтобы увидеть его продажи по дням.</div>';
  h+='<h2>Загрузить продажи</h2><div class="card"><div style="font-size:14px;line-height:1.55">Paloma → «Отчёт по сотрудникам» → выгрузите в Excel <b>по дням</b> (или за один день) и выберите файл здесь. Повторная загрузка тех же дней заменит данные.</div><input type="file" id="xf" accept=".xlsx,.xls" class="hidden"><button class="btn gold" id="xb">Выбрать файл отчёта</button><div id="xr" class="small" style="margin-top:10px;line-height:1.5">'+(S.upMsg||"")+'</div></div>';
  var ch=(b.checks||[]); var diff=ch.filter(function(c){return c.fact!==c.system});
  h+='<h2>Сверки товара</h2>';
  if(!ch.length) h+='<div class="empty" style="padding:20px">Пока сверок нет.</div>';
  else h+='<div class="chips"><button class="chip '+(S.chkAll?"":"on")+'" id="cd">С расхождением · '+diff.length+'</button><button class="chip '+(S.chkAll?"on":"")+'" id="ca">Все · '+ch.length+'</button></div><div class="list">'+(S.chkAll?ch:diff).slice(0,150).map(function(c){var d=c.fact-c.system;return '<div class="li"><div><div style="font-size:14px">'+esc(c.item)+'</div><div class="small muted">'+esc(c.who)+' · '+timeLabel(c.at)+(c.note?' · '+esc(c.note):'')+'</div></div><div class="r"><b class="'+(d===0?"pos":"neg")+'">'+(d>0?"+":"")+d+'</b><div class="small muted">'+c.fact+' факт / '+c.system+' Paloma</div></div></div>'}).join("")+'</div>';
  h+='<h2>Пароли</h2><div class="card"><label class="fld"><span>Сотрудник</span><select id="pu">'+(b.team||[]).map(function(e){return '<option value="'+esc(e.login)+'">'+esc(e.name)+' ('+esc(e.login)+')</option>'}).join("")+'<option value="'+esc(b.me.login)+'">Я ('+esc(b.me.login)+')</option></select></label><button class="btn ghost" id="pb">Сделать новый пароль</button><div id="pr" style="margin-top:10px"></div><div class="small muted" style="margin-top:8px;line-height:1.5">Старый пароль сразу перестанет работать, сотрудника выкинет из кабинета.</div></div>';
  $("#view").innerHTML=h;
  document.querySelectorAll(".chip[data-m]").forEach(function(c){c.onclick=function(){S.month=c.dataset.m;renderAdmin()}});
  document.querySelectorAll(".li[data-e]").forEach(function(r){r.onclick=function(){S.adminEmp=r.dataset.e;renderAdmin();scrollTo(0,0)}});
  var cd=$("#cd"),ca=$("#ca"); if(cd){cd.onclick=function(){S.chkAll=false;renderAdmin()};ca.onclick=function(){S.chkAll=true;renderAdmin()}}
  $("#xb").onclick=function(){$("#xf").click()};
  $("#xf").onchange=function(e){var f=e.target.files&&e.target.files[0]; if(f) uploadReport(f); e.target.value="";};
  $("#pb").onclick=function(){
    var login=$("#pu").value; var A="abcdefghjkmnpqrstuvwxyz23456789",D="23456789",pw="";var rnd=new Uint32Array(8);crypto.getRandomValues(rnd);for(var i=0;i<4;i++)pw+=A[rnd[i]%A.length];pw+="-";for(i=4;i<8;i++)pw+=D[rnd[i]%D.length];
    if(window.confirm && !window.confirm("Сделать новый пароль для "+login+"?")) return;
    var btn=this; btn.disabled=true;
    api("setpass",{target:login,password:pw}).then(function(j){btn.disabled=false; if(j.ok){ $("#pr").innerHTML='<div class="card dark" style="margin:0"><div class="kicker">Новый пароль · '+esc(login)+'</div><div class="big" style="font-family:var(--sans);letter-spacing:.06em;user-select:all">'+esc(pw)+'</div><div class="small" style="color:#BDB5A8">Отправьте сотруднику лично. Больше он нигде не показывается.</div></div>'; if(login===b.me.login){toast("Пароль изменён, войдите заново");setTimeout(function(){logout(false)},3500)} } else $("#pr").innerHTML='<div class="err">Не получилось: '+esc(j.error||"")+'</div>'; });
  };
}
function loadXlsx(){ return new Promise(function(res,rej){ if(window.XLSX) return res(window.XLSX); var s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"; s.integrity="sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw"; s.crossOrigin="anonymous"; s.onload=function(){res(window.XLSX)}; s.onerror=function(){rej(new Error("xlsx"))}; document.head.appendChild(s); }); }
function nk(s){return String(s||"").toLowerCase().replace(/ұ|ү/g,"у").replace(/қ/g,"к").replace(/ә/g,"а").replace(/і/g,"и").replace(/ң/g,"н").replace(/ғ/g,"г").replace(/ө/g,"о").replace(/һ/g,"х").replace(/ё/g,"е").replace(/\s+/g," ").trim()}
function num(v){if(typeof v==="number")return v;var s=String(v==null?"":v).replace(/[\s ]/g,"").replace(",",".");var n=parseFloat(s);return isNaN(n)?0:n}
function parseRuDate(s){var m=String(s||"").trim().match(/^(\d{1,2})\s+([а-яё]+)\s+(\d{4})/i);if(!m)return null;var mi=MONG.indexOf(m[2].toLowerCase());if(mi<0)return null;return m[3]+"-"+String(mi+1).padStart(2,"0")+"-"+String(+m[1]).padStart(2,"0")}
function uploadReport(file){
  var out=$("#xr"); out.innerHTML='<span class="spin"></span> Читаю файл…';
  var team=(S.boot.team||[]); var map={}; team.forEach(function(e){map[nk(e.name)]=e.emp_id});
  loadXlsx().then(function(XLSX){ return file.arrayBuffer().then(function(buf){
    var wb=XLSX.read(buf,{type:"array"}); var ws=wb.Sheets[wb.SheetNames[0]];
    var A=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:""});
    var rows=[], skipped={}, cur=null, period=null;
    A.forEach(function(r){var t=r.map(function(x){return String(x).trim()});var line=t.join(" ");var pm=line.match(/с\s+(\d{2})\.(\d{2})\.(\d{4}).*?по\s+(\d{2})\.(\d{2})\.(\d{4})/);if(pm&&!period)period={from:pm[3]+"-"+pm[2]+"-"+pm[1],to:pm[6]+"-"+pm[5]+"-"+pm[4]}});
    var hdr=-1; for(var i=0;i<A.length;i++){var t=A[i].map(function(x){return String(x).trim()}); if(t.indexOf("Общая сумма")>=0){hdr=i;break}}
    if(hdr<0) throw new Error("Не нашёл колонку «Общая сумма». Это точно «Отчёт по сотрудникам»?");
    var H=A[hdr].map(function(x){return String(x).trim()}); var cS=H.indexOf("Общая сумма"), cR=H.indexOf("Сумма возвратов"), cE=H.indexOf("Сотрудник"), cD=H.indexOf("Дата");
    for(i=hdr+1;i<A.length;i++){
      var r=A[i].map(function(x){return String(x).trim()}); var joined=r.join(" ");
      var em=joined.match(/Сотрудник:\s*([^\s].*?)\s*$/);
      if(em){ var nm=r.filter(function(x){return /Сотрудник:/.test(x)})[0].replace(/Сотрудник:\s*/,""); cur=map[nk(nm)]||null; if(!cur) skipped[nm]=1; continue; }
      var day = cD>=0 ? parseRuDate(r[cD]) : null; if(!day){ for(var k=0;k<r.length;k++){ day=parseRuDate(r[k]); if(day) break; } }
      if(day && cur){ rows.push({emp_id:cur, day:day, sales:num(r[cS]), returns:cR>=0?num(r[cR]):0}); continue; }
      if(cE>=0 && r[cE] && !/итого/i.test(r[cE])){ var id=map[nk(r[cE])]; if(!id){ if(/[а-яёa-z]{2}/i.test(r[cE])) skipped[r[cE]]=1; continue; } if(!period||period.from!==period.to) throw new Error("Это отчёт за период без разбивки по дням. Выгрузите «по дням» или за один день."); rows.push({emp_id:id, day:period.from, sales:num(r[cS]), returns:cR>=0?num(r[cR]):0}); }
    }
    if(!rows.length) throw new Error("В файле не нашлось продаж сотрудников.");
    var days={}; rows.forEach(function(x){days[x.day]=1}); var dl=Object.keys(days).sort();
    out.innerHTML='<span class="spin"></span> Сохраняю '+rows.length+' строк…';
    return api("upload",{rows:rows}).then(function(j){
      if(!j.ok) throw new Error(j.error==="net"?"Нет соединения":"Сервер не принял файл: "+(j.error||""));
      var sk=Object.keys(skipped); S.upMsg='✅ Загружено: '+rows.length+' строк, дни '+dl[0].slice(8,10)+"."+dl[0].slice(5,7)+(dl.length>1?" – "+dl[dl.length-1].slice(8,10)+"."+dl[dl.length-1].slice(5,7):"")+'.'+(sk.length?'<br><span class="muted">Пропущены (нет в списке сотрудников): '+esc(sk.join(", "))+'</span>':''); out.innerHTML=S.upMsg;
      refresh();
    });
  }); }).catch(function(e){ out.innerHTML='<div class="err">'+esc(e.message==="xlsx"?"Не загрузился модуль Excel. Проверьте интернет и попробуйте ещё раз.":e.message)+'</div>'; });
}

/* ---------- start ---------- */
render();
if(S.token) refresh();
document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible" && S.token && S.boot && Date.now()-(S.lastRefresh||0)>60000){ S.lastRefresh=Date.now(); refresh(); } });
S.lastRefresh=Date.now();
})();
</script>
