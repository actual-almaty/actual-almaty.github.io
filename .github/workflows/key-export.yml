name: Разовая передача ключа (зашифровано)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/key-export.yml']
permissions:
  contents: write
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Encrypt
        env:
          A: ${{ secrets.PALOMA_MCP_TOKEN }}
          B: ${{ secrets.PALOMA_API_KEY }}
        run: |
          cat > /tmp/pub.pem <<'K'
-----BEGIN PUBLIC KEY-----
MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAp/j7x2RN683p5bQve2ld
mrGxLMK1u6QJmB/Tr4OMCHVpb38mV1xQv+SH7AY75kjT7e/tJvKnTiuhzWWk9JF6
JgiFZ+5TfpZAzXD2kg0I7JnzLEon60QuE53bc1gNiIiZMirNiaXCTbtTRrSXRTkF
vv485i0YXlz4o2kf1JWKSNwwMD2L5egOmYm4KitU/FiNd6ytCXOUW0c4V1prBTlz
Dtv0ETP3FBsR55EEdGdU7+hiK/ZtoSLTro0umXyIeqMaPdRyyYz16EdXuqm5Ggd9
G0pVOK6J48Lx4x2mG0kcKhI35omD9KsavKT8Q+1ebB7RtBlSMYiiXxKXHgsq6ZzP
NvdHuVXmjWzfiSTQGTl6MufC0LeKfJdo/U8+OBuRi2Ognoof1ZqBRcK8Mcwx4Ys9
TmLwQQIRBDhV7ZrppielS73c23fVzZL+0cAMibfAV9d7naaXZ+ru7jFtWFm+XtXF
L9CTUIJlngER4d5eRbswG2wwOig0Esua/0Jl2pAjyQv7AgMBAAE=
-----END PUBLIC KEY-----
          K
          sed -i 's/^ *//' /tmp/pub.pem
          printf '%s\n%s' "$A" "$B" > /tmp/t
          openssl rand -hex 32 > /tmp/k
          openssl enc -aes-256-cbc -pbkdf2 -in /tmp/t -out /tmp/t.enc -pass file:/tmp/k
          openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k -out /tmp/k.enc
          mkdir -p tmpk && base64 -w0 /tmp/t.enc > tmpk/t && base64 -w0 /tmp/k.enc > tmpk/k
          rm -f /tmp/t /tmp/k
          git config user.name actual-bot && git config user.email actual-bot@users.noreply.github.com
          git add tmpk && git commit -m "tmp" && git pull --rebase -q && git push
