name: Обновление сайта из Paloma

on:
  schedule:
    - cron: '*/15 3-17 * * *'   # каждые 15 минут, 08:00–22:59 по Алматы
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['img/**', 'scripts/**']

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Собрать каталог
        env:
          PALOMA_API_KEY: ${{ secrets.PALOMA_API_KEY }}
          PALOMA_MCP_TOKEN: ${{ secrets.PALOMA_MCP_TOKEN }}
        run: |
          set -o pipefail
          node scripts/build.mjs 2>&1 | tee build.log
      - name: Опубликовать
        if: always()
        run: |
          { echo "Запуск: $(TZ=Asia/Almaty date '+%Y-%m-%d %H:%M')"; echo "Ключ API: ${{ secrets.PALOMA_API_KEY != '' && 'есть' || 'НЕТ' }}"; echo "Ключ остатков: ${{ secrets.PALOMA_MCP_TOKEN != '' && 'есть' || 'НЕТ' }}"; tail -n 20 build.log 2>/dev/null || echo "нет журнала"; } > status.txt
          git config user.name "actual-bot"
          git config user.email "actual-bot@users.noreply.github.com"
          git add index.html status.txt
          if git diff --cached --quiet; then echo "Без изменений"; exit 0; fi
          git commit -m "Обновление каталога $(TZ=Asia/Almaty date '+%Y-%m-%d %H:%M')"
          git push
