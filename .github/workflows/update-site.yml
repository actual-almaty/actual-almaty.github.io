name: Обновление сайта из Paloma

on:
  schedule:
    - cron: '*/15 3-17 * * *'   # каждые 15 минут, 08:00–22:59 по Алматы
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['img/**', 'scripts/**']

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Собрать каталог
        env:
          PALOMA_API_KEY: ${{ secrets.PALOMA_API_KEY }}
          PALOMA_MCP_TOKEN: ${{ secrets.PALOMA_MCP_TOKEN }}
        run: node scripts/build.mjs
      - name: Опубликовать
        run: |
          if git diff --quiet -- index.html; then echo "Без изменений"; exit 0; fi
          git config user.name "actual-bot"
          git config user.email "actual-bot@users.noreply.github.com"
          git add index.html
          git commit -m "Обновление каталога $(TZ=Asia/Almaty date '+%Y-%m-%d %H:%M')"
          git push
