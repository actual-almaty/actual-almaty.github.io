<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ACTUAL · Мужская одежда · Алматы</title>
<meta name="description" content="ACTUAL — бутик мужской одежды в ТРЦ Riviera Park, Алматы. Каталог, размеры, заказ онлайн.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F4F0;--card:#EDEAE4;--ink:#111;--ink2:#555;--line:#DAD5CC;--gold:#A8843F;--serif:"Cormorant Garamond",Georgia,serif;--sans:"Manrope",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:20;background:rgba(246,244,240,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:58px;padding:0 18px}
.logo{font-family:var(--serif);font-weight:500;font-size:24px;letter-spacing:.38em;padding-left:.38em;text-decoration:none}
.icon-btn{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;background:none;cursor:pointer;text-decoration:none}
.icon-btn svg{width:22px;height:22px}
.chips{max-width:1200px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:0 14px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:none;padding:8px 10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);cursor:pointer;border-bottom:1px solid transparent}
.chip.on{color:var(--ink);border-bottom-color:var(--ink)}
main{max-width:1200px;margin:0 auto;padding:18px 14px 80px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 10px}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:34px 16px}}
.tile{text-decoration:none;display:block}
.tile .im{aspect-ratio:3/4;background:var(--card);overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.tile:hover img{transform:scale(1.03)}
.tile .t{margin-top:10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;line-height:1.35}
.tile .p{margin-top:4px;font-size:13px;color:var(--ink2)}
.tile .dots{display:flex;gap:5px;margin-top:6px}
.tile .dots i{width:7px;height:7px;border-radius:50%;border:1px solid var(--line);background:var(--card)}
.empty{text-align:center;color:var(--ink2);padding:60px 10px;line-height:1.7}
/* product */
.pd{display:grid;gap:22px}
@media(min-width:900px){.pd{grid-template-columns:1.2fr 1fr;gap:48px;align-items:start}.info{position:sticky;top:90px}}
.back{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:0 0 14px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;color:var(--ink2);min-height:40px}
.gal{position:relative}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:var(--card)}
.slides::-webkit-scrollbar{display:none}
.slides img,.slides video{flex:none;width:100%;aspect-ratio:3/4;object-fit:cover;scroll-snap-align:start;display:block}
@media(min-width:900px){.slides{display:grid;grid-template-columns:1fr 1fr;gap:6px;overflow:visible;background:none}.slides img{width:100%}}
.pager{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.pager i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55)}
.pager i.on{background:#fff}
@media(min-width:900px){.pager{display:none}}
.note{font-size:12px;color:var(--ink2);margin-top:8px;letter-spacing:.02em}
.info h1{margin:0;font-weight:500;font-size:20px;letter-spacing:.06em;text-transform:uppercase;line-height:1.3}
.code{margin-top:6px;font-size:12px;color:var(--ink2);letter-spacing:.08em}
.price{margin-top:14px;font-size:20px}
.lbl{margin:22px 0 10px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2);display:flex;justify-content:space-between;align-items:center}
.lbl button{border:0;background:none;padding:0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;text-decoration:underline;cursor:pointer;color:var(--ink);min-height:32px}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.color{border:1px solid var(--line);background:none;padding:9px 14px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;min-height:40px}
.color.on{border-color:var(--ink)}
.sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:8px}
.size{position:relative;border:1px solid var(--line);background:none;height:46px;cursor:pointer;font-size:14px}
.size.on{border-color:var(--ink);background:var(--ink);color:#fff}
.size.out{color:#aaa;cursor:not-allowed;background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(0,0,0,.035) 6px 7px)}
.size small{position:absolute;left:0;right:0;bottom:2px;font-size:9px;letter-spacing:.06em;color:var(--gold)}
.asia{margin-top:12px;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);font-size:13px;line-height:1.5}
.asia b{font-weight:600}
.asia svg{flex:none;width:18px;height:18px;margin-top:1px;color:var(--gold)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-size:13px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;text-decoration:none;margin-top:10px}
.btn.ghost{background:none;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.desc{margin-top:22px;font-size:14px;line-height:1.7;color:var(--ink2);white-space:pre-line}
.shop{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;line-height:1.8;color:var(--ink2)}
/* sheet */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.veil{align-items:center}}
.sheet{width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--bg);padding:24px 20px calc(24px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 4px;font-family:var(--serif);font-weight:500;font-size:26px}
.sheet .sub{font-size:13px;color:var(--ink2);margin-bottom:16px;line-height:1.5}
.fld{display:block;margin-top:12px}
.fld span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:#fff;padding:13px 12px;font-size:16px;border-radius:0;-webkit-appearance:none;appearance:none}
.fld textarea{min-height:70px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.err{margin-top:10px;color:#A3261F;font-size:13px;line-height:1.5}
.close{float:right;border:0;background:none;width:40px;height:40px;margin:-10px -10px 0 0;cursor:pointer;font-size:22px}
.res{margin-top:16px;padding:14px;border:1px solid var(--ink);font-size:15px;line-height:1.5}
.ok{text-align:center}
.ok .num{font-family:var(--serif);font-size:34px;margin:6px 0}
footer{border-top:1px solid var(--line);padding:28px 18px 40px;text-align:center;font-size:12px;line-height:1.9;color:var(--ink2)}
footer a{text-decoration:none}
.nophoto{display:flex;align-items:center;justify-content:center;text-align:center;aspect-ratio:3/4;width:100%;background:#f2f2f2;color:#777;font-size:14px;line-height:1.5;padding:20px;box-sizing:border-box}
</style>
</head>
<body>
<header>
<div class="bar">
<a class="icon-btn" href="https://instagram.com/actual.almaty" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".9" fill="currentColor" stroke="none"/></svg></a>
<a class="logo" href="#">ACTUAL</a>
<a class="icon-btn" id="waTop" href="#" target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.6a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.5-4.3a8.5 8.5 0 1 1 15.5-4.6z"/><path d="M9 8.8c.2 2.6 2.6 5 5.2 5.2l1-1.2-1.8-.9-.8.7a4 4 0 0 1-2.2-2.2l.7-.8-.9-1.8z"/></svg></a>
</div>
<nav class="chips" id="chips"></nav>
</header>
<main id="main"></main>
<footer>
<div>ACTUAL · Алматы, ул. Каныш Сатпаева 90/21, ТРЦ Riviera Park, 1 этаж</div>
<div>Ежедневно 10:00–22:00 · <a href="tel:+77776111082">+7 777 611 1082</a></div>
<div><a href="https://2gis.kz/almaty/search/Riviera%20Park" target="_blank" rel="noopener">Маршрут в 2ГИС</a> · <a href="https://instagram.com/actual.almaty" target="_blank" rel="noopener">@actual.almaty</a></div>
</footer>

<div class="veil hidden" id="veil"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
const DATA = __DATA__;
const SHOP_WA = "77776111082";
const SHOES = new Set(["Ботинки","Кеды","Челси","Кроссовки","Туфли","Лоферы","Сапоги","Мокасины","Обувь","Слипоны"]);
const MODEL_NOTE = "Модель на фото: рост 175 см, вес 70 кг, носит M или L";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => String(Math.round(+n||0)).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " ₸";
const wa = text => "https://wa.me/" + SHOP_WA + "?text=" + encodeURIComponent(text);
const TRACK = "https://actual.app.n8n.cloud/webhook/shop-track";
const rid = n => { const a = "abcdefghijkmnpqrstuvwxyz23456789"; let r = ""; try { crypto.getRandomValues(new Uint8Array(n)).forEach(b => r += a[b % 32]); } catch(e) { for (let i = 0; i < n; i++) r += a[Math.floor(Math.random() * 32)]; } return r; };
let VID = "", SID = "";
try { VID = localStorage.getItem("a_vid") || ""; if (!VID) { VID = rid(12); localStorage.setItem("a_vid", VID); } } catch(e) { VID = VID || rid(12); }
try { SID = sessionStorage.getItem("a_sid") || ""; } catch(e) {}
const FIRST = !SID;
if (!SID) { SID = rid(10); try { sessionStorage.setItem("a_sid", SID); } catch(e) {} }
const SRC = (() => {
  let saved = ""; try { saved = sessionStorage.getItem("a_src") || ""; } catch(e) {}
  if (saved) return saved;
  const q = new URLSearchParams(location.search), u = (q.get("utm_source") || q.get("src") || "").toLowerCase(), ua = navigator.userAgent || "", r = document.referrer || "";
  let s = "Прямой заход";
  if (/insta|^ig$/.test(u) || /Instagram/i.test(ua) || /instagram\./i.test(r)) s = "Instagram";
  else if (/tiktok/.test(u) || /TikTok|musical_ly|Bytedance/i.test(ua) || /tiktok\./i.test(r)) s = "TikTok";
  else if (/whats|^wa$/.test(u) || /whatsapp/i.test(r)) s = "WhatsApp";
  else if (/2gis/.test(u) || /2gis\./i.test(r)) s = "2ГИС";
  else if (/telegram|^tg$/.test(u) || /Telegram/i.test(ua) || /t\.me|telegram/i.test(r)) s = "Telegram";
  else if (/FBAN|FBAV/i.test(ua) || /facebook\./i.test(r)) s = "Facebook";
  else if (/google\.|yandex\.|bing\./i.test(r)) s = "Поиск Google/Яндекс";
  else if (u) s = u.slice(0, 24);
  else if (r && !/actual-almaty\.github\.io/.test(r)) s = "Другие сайты";
  try { sessionStorage.setItem("a_src", s); } catch(e) {}
  return s;
})();
const Q = FIRST ? [{ t: "visit" }] : [];
function flush(){
  if (!Q.length) return;
  const body = new URLSearchParams({ d: JSON.stringify({ v: VID, s: SID, src: SRC, e: Q.splice(0, 40) }) });
  try { if (!(navigator.sendBeacon && navigator.sendBeacon(TRACK, body))) fetch(TRACK, { method: "POST", body, mode: "no-cors", keepalive: true }); } catch(e) {}
}
function track(e){ Q.push(e); if (Q.length >= 8) flush(); }
addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });
addEventListener("pagehide", flush);
$("#waTop").href = wa("Здравствуйте! Пишу с сайта ACTUAL.");
$("#waTop").addEventListener("click", function(){ const o = rid(4).toUpperCase(); this.href = wa("Здравствуйте! Пишу с сайта ACTUAL.\nКод: " + o); track({ t: "wa", n: "Вопрос с сайта", o }); flush(); });

const PRODUCTS = DATA.map(r => { let v = {}; try { v = JSON.parse(r.variants || "{}"); } catch(e){} return { key: r.model_key, title: r.title, type: r.category_id, price: +r.price, img: r.image_url, colors: v.colors || [], code: v.code || "", desc: v.desc || "" }; })
  .filter(p => p.colors.length);
const TYPES = [...new Set(PRODUCTS.map(p => p.type).filter(Boolean))];
let state = { type: "", color: 0, size: null };

function chips(){
  const all = [["", "Все"], ...TYPES.map(t => [t, t])];
  $("#chips").innerHTML = all.map(([k,l]) => `<button class="chip ${state.type===k?"on":""}" data-t="${esc(k)}">${esc(l)}</button>`).join("");
  $("#chips").querySelectorAll(".chip").forEach(b => b.onclick = () => { state.type = b.dataset.t; location.hash = ""; render(); });
}
function list(){
  $("#chips").classList.remove("hidden");
  const ps = PRODUCTS.filter(p => !state.type || p.type === state.type);
  if (!ps.length){ $("#main").innerHTML = `<div class="empty">Каталог обновляется.<br>Напишите нам в <a href="${wa("Здравствуйте! Хочу посмотреть ассортимент.")}" target="_blank" rel="noopener">WhatsApp</a> — подберём вещь.</div>`; return; }
  $("#main").innerHTML = `<div class="grid">${ps.map(p => {
    const img = (p.colors[0].images||[])[0] || p.img;
    return `<a class="tile" href="#p=${encodeURIComponent(p.key)}"><div class="im"><img loading="lazy" src="${esc(img)}" alt="${esc(p.title)}"></div><div class="t">${esc(p.title)}</div><div class="p">${fmt(p.price)}</div>${p.colors.length>1?`<div class="p">${p.colors.length} ${p.colors.length<5?"цвета":"цветов"}</div>`:""}</a>`; }).join("")}</div>`;
}
function product(p){
  $("#chips").classList.add("hidden");
  const c = p.colors[state.color] || p.colors[0];
  const one = c.sizes.every(s => s.s === "ONE"), shoes = SHOES.has(p.type);
  if (one) state.size = "ONE";
  const imgs = (c.images && c.images.length) ? c.images : [];
  const price = (c.sizes.find(s => s.s === state.size) || c.sizes[0] || {}).price || p.price;
  $("#main").innerHTML = `
  <button class="back" id="back">← Каталог</button>
  <div class="pd">
    <div class="gal"><div class="slides" id="slides">${(c.videos||[]).map(u => `<video src="${esc(u)}" muted loop playsinline autoplay preload="auto"></video>`).join("")}${imgs.length?imgs.map(u => `<img src="${esc(u)}" alt="${esc(p.title)}">`).join(""):`<div class="nophoto">Фото этого цвета скоро добавим.<br>Попросите фото в WhatsApp</div>`}</div>
      ${imgs.length>1?`<div class="pager" id="pager">${[...(c.videos||[]),...imgs].map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</div>`:""}
      ${one||shoes?"":`<div class="note">${MODEL_NOTE}</div>`}</div>
    <div class="info">
      <h1>${esc(p.title)}</h1>
      ${p.code?`<div class="code">Артикул ${esc(p.code)}</div>`:""}
      <div class="price">${fmt(price)}</div>
      ${p.colors.length>1?`<div class="lbl">Цвет: ${esc(c.name)}</div><div class="colors">${p.colors.map((x,i)=>`<button class="color ${i===state.color?"on":""}" data-i="${i}">${esc(x.name||"—")}</button>`).join("")}</div>`:(c.name?`<div class="lbl">Цвет: ${esc(c.name)}</div>`:"")}
      ${one?"":`<div class="lbl">Размер ${shoes?"":`<button id="fit">Подобрать размер</button>`}</div>
      <div class="sizes">${c.sizes.map(s => `<button class="size ${s.qty>0?"":"out"} ${state.size===s.s?"on":""}" data-s="${esc(s.s)}" ${s.qty>0?"":"disabled"} aria-label="Размер ${esc(s.s)}${s.qty>0?"":", нет в наличии"}">${esc(s.s)}</button>`).join("")}</div>
      <div class="asia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg><div>${shoes?"<b>Размеры обуви — европейская сетка (EU).</b> Сомневаетесь в размере — напишите нам, подскажем.":"<b>Азиатский стандарт — маломерит.</b> Если сомневаетесь, нажмите «Подобрать размер» или возьмите на размер больше."}</div></div>`}
      <a class="btn" id="waAsk" target="_blank" rel="noopener" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.6a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.5-4.3a8.5 8.5 0 1 1 15.5-4.6z"/></svg>Заказать в WhatsApp</a>
      <div class="note" style="text-align:center">${state.size||one?"":"Выберите размер — он сразу попадёт в сообщение"}</div>
      ${p.desc?`<div class="desc">${esc(p.desc)}</div>`:""}
      <div class="shop">Примерка и покупка в бутике: ТРЦ Riviera Park, 1 этаж, 10:00–22:00.<br>Доставка по Алматы в день заказа, по Казахстану — Казпочта и СДЭК.</div>
    </div>
  </div>`;
  const askText = `Здравствуйте! Хочу заказать с сайта:\n${p.title}\nЦвет: ${c.name||"—"}${one?"":`\nРазмер: ${state.size||"подскажите"}`}\nЦена: ${fmt(price)}\n${location.href}`;
  $("#waAsk").href = wa(askText);
  $("#waAsk").onclick = function(){ const o = rid(4).toUpperCase(); this.href = wa(askText + "\nКод заказа: " + o); track({ t: "wa", k: p.key, n: p.title, c: c.name || "", z: one ? "" : (state.size || ""), p: price, o }); flush(); };
  $("#back").onclick = () => { location.hash = ""; };
  if ($("#fit")) $("#fit").onclick = () => fitSheet(p, c);
  document.querySelectorAll(".color").forEach(b => b.onclick = () => { state.color = +b.dataset.i; state.size = null; product(p); });
  document.querySelectorAll(".size:not(.out)").forEach(b => b.onclick = () => { state.size = b.dataset.s; product(p); });
  const sl = $("#slides"), pg = $("#pager");
  if (sl) sl.querySelectorAll("video").forEach(v => { v.muted = true; v.play().catch(() => {}); });
  if (sl && pg) sl.addEventListener("scroll", () => { const i = Math.round(sl.scrollLeft / sl.clientWidth); pg.querySelectorAll("i").forEach((d,k)=>d.classList.toggle("on",k===i)); }, {passive:true});
}
function openSheet(html){ $("#sheet").innerHTML = `<button class="close" aria-label="Закрыть" onclick="closeSheet()">×</button>` + html; $("#veil").classList.remove("hidden"); }
function closeSheet(){ $("#veil").classList.add("hidden"); }
$("#veil").addEventListener("click", e => { if (e.target.id === "veil") closeSheet(); });

function suggest(h, w){
  if (!w) return null;
  if (w < 74) return { main: "M", text: "Вам подойдёт <b>M</b>." };
  if (w <= 76) return { main: "M", text: "Вы на границе: <b>M</b> — по фигуре, <b>L</b> — свободнее. Лучше примерить оба в бутике или напишите нам." };
  if (w <= 85) return { main: "L", text: "Вам подойдёт <b>L</b>." };
  return { main: "XL", text: "Скорее <b>XL</b>, но лучше уточнить у консультанта в WhatsApp — посадка зависит от модели." };
}
function fitSheet(p, c){
  openSheet(`<h2>Подбор размера</h2><div class="sub">Размеры по азиатскому стандарту, они меньше европейских. Ориентир: модель 175 см / 70 кг носит M или L.</div>
  <div class="row"><label class="fld"><span>Рост, см</span><input id="fh" inputmode="numeric" placeholder="175"></label><label class="fld"><span>Вес, кг</span><input id="fw" inputmode="numeric" placeholder="72"></label></div>
  <button class="btn" id="fgo">Подобрать</button><div id="fres"></div>`);
  $("#fgo").onclick = () => {
    const r = suggest(+$("#fh").value, +$("#fw").value);
    if (!r){ $("#fres").innerHTML = `<div class="err">Укажите вес.</div>`; return; }
    const has = c.sizes.find(s => s.s === r.main && s.qty > 0);
    $("#fres").innerHTML = `<div class="res">${r.text}${has?"":`<br><small>Размера ${r.main} в этом цвете сейчас нет — напишите нам, подберём альтернативу.</small>`}</div>${has?`<button class="btn ghost" id="fpick">Выбрать ${r.main}</button>`:""}`;
    if (has) $("#fpick").onclick = () => { state.size = r.main; closeSheet(); product(p); };
  };
}
let lastView = "";
function render(){
  chips();
  const m = location.hash.match(/^#p=(.+)$/);
  const p = m && PRODUCTS.find(x => x.key === decodeURIComponent(m[1]));
  if (p) { product(p); if (lastView !== p.key) { lastView = p.key; track({ t: "view", k: p.key, n: p.title }); } } else { lastView = ""; list(); }
  scrollTo(0, 0);
}
addEventListener("hashchange", () => { state.color = 0; state.size = null; render(); });
render();
</script>
