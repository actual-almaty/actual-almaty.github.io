<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="apple-touch-icon" href="/app/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ACTUAL">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ACTUAL · Мужская одежда · Алматы</title>
<meta name="description" content="ACTUAL — бутик мужской одежды в ТРЦ Riviera Park, Алматы. Каталог, размеры, заказ онлайн.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--bg2:#F4F4F2;--card:#EFEFEC;--ink:#0A0A0A;--ink2:#6E6E6A;--line:#E3E2DE;--gold:#B39062;--gold2:#8C6C3F;--f:"Inter Tight",system-ui,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
img{display:block}
.hidden{display:none!important}
::selection{background:var(--ink);color:#fff}
/* intro — фирменный знак: чёрный + золото */
.intro{position:fixed;inset:0;z-index:90;background:#0A0A0A;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;transition:opacity .6s var(--ease),visibility .6s}
.intro.done{opacity:0;visibility:hidden}
.intro .w{font-weight:900;font-size:clamp(44px,13vw,110px);letter-spacing:.06em;display:flex;overflow:hidden;color:var(--gold)}
.intro .w span{display:inline-block;transform:translateY(110%);animation:up .8s var(--ease) forwards}
.intro .s{font-size:10px;font-weight:600;letter-spacing:.42em;color:#fff;opacity:0;animation:fade .8s .8s forwards;padding-left:.42em}
.intro .ln{width:0;height:2px;background:var(--gold);animation:ln .8s .5s var(--ease) forwards}
@keyframes up{to{transform:none}}@keyframes fade{to{opacity:1}}@keyframes ln{to{width:56px}}
/* header */
header{position:fixed;top:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);transition:transform .4s var(--ease),box-shadow .3s}
header.solid{box-shadow:0 1px 0 var(--line)}
header.up{transform:translateY(-100%)}
.bar{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 10px}
.logo{font-weight:900;font-size:21px;letter-spacing:.04em}
.ib{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;background:none;cursor:pointer;border-radius:50%}
.ib svg{width:21px;height:21px}
/* hero */
.hero{position:relative;margin:64px 10px 0;height:calc(100svh - 160px);min-height:460px;max-height:860px;border-radius:24px;overflow:hidden;background:var(--card)}
@media(min-width:900px){.hero{max-width:1260px;margin:70px auto 0}}
.hero .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease}
.hero .slide.on{opacity:1}
.hero .slide img,.hero .slide video{width:100%;height:100%;object-fit:cover;transform:scale(1.08)}
.hero .slide video{transform:none}
.hero .slide.on img{animation:kb 8s linear forwards}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.6) 100%);pointer-events:none}
.hero .cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:0 18px 22px;color:#fff}
.kicker{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:10px}
.hero .kicker{color:#E7D2AD}
.hero h1{margin:8px 0 0;font-weight:900;font-size:clamp(46px,14vw,120px);line-height:.88;letter-spacing:-.045em;text-transform:uppercase}
.hero h1 em{font-style:normal}
.hero p{margin:12px 0 0;max-width:420px;color:rgba(255,255,255,.88);font-size:14px;line-height:1.5}
.cta{display:inline-flex;align-items:center;gap:10px;margin-top:16px;padding:14px 20px;border-radius:999px;background:#fff;color:#000;font-size:14px;font-weight:600;border:0;cursor:pointer;transition:transform .25s var(--ease)}
.cta:active{transform:scale(.96)}
.cta.gold{background:var(--ink);color:#fff}
.cta svg{width:16px;height:16px}
.hdots{position:absolute;right:16px;top:16px;z-index:3;display:flex;gap:6px}
.hdots i{width:22px;height:3px;background:rgba(255,255,255,.35);border-radius:3px;overflow:hidden;position:relative}
.hdots i.on:after{content:"";position:absolute;inset:0;background:#fff;animation:fillx 6s linear forwards;transform-origin:left}
@keyframes fillx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* marquee */
.mq{overflow:hidden;margin-top:18px;padding:12px 0;background:var(--ink)}
.mq .tr{display:flex;width:max-content;animation:mq 30s linear infinite}
.mq span{font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:0 18px;white-space:nowrap;color:#fff}
.mq span b{color:var(--gold);font-weight:800;margin-left:18px}
@keyframes mq{to{transform:translateX(-50%)}}
/* sections */
section{max-width:1280px;margin:0 auto;padding:40px 0 0}
.sh{display:flex;align-items:flex-end;justify-content:space-between;padding:0 14px;margin-bottom:14px;gap:12px}
.sh h2{margin:0;font-weight:900;font-size:clamp(30px,9vw,52px);line-height:.92;letter-spacing:-.04em;text-transform:uppercase}
.sh h2 em{font-style:normal;color:var(--gold)}
.sh small{font-size:12px;font-weight:500;color:var(--ink2);white-space:nowrap}
/* категории */
.stories{display:flex;gap:6px;overflow-x:auto;padding:2px 14px 14px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.st{flex:none;display:flex;align-items:center;gap:8px;height:42px;padding:0 14px 0 4px;border-radius:999px;border:0;background:var(--bg2);cursor:pointer;font-weight:500;font-size:14px;transition:background .25s}
.st .ring{width:34px;height:34px;border-radius:50%;overflow:hidden;background:var(--card)}
.st .ring>div{width:100%;height:100%}
.st img{width:100%;height:100%;object-fit:cover}
.st .all{display:flex;align-items:center;justify-content:center;height:100%;font-weight:800;font-size:11px}
.st span{white-space:nowrap}
.st.on{background:var(--ink);color:#fff}
.st.on .all{color:var(--gold)}
.st:active{transform:scale(.96)}
/* лента */
.rail{display:flex;gap:8px;overflow-x:auto;padding:0 14px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .tile{flex:none;width:64vw;max-width:290px;scroll-snap-align:start}
/* поиск */
.search{display:flex;align-items:center;gap:10px;margin:0 14px 16px;padding:0 16px;height:48px;border-radius:999px;background:var(--bg2)}
.search svg{width:18px;height:18px;color:var(--ink2);flex:none}
.search input{flex:1;border:0;background:none;outline:none;font-size:15px;min-width:0}
.search input::placeholder{color:var(--ink2)}
/* сетка */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 8px;padding:0 10px}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:36px 14px;padding:0 14px}}
@media(min-width:1100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:linear-gradient(160deg,#151412,#0A0A0A);color:var(--gold)}.tile .ph b{font-weight:900;letter-spacing:.18em;font-size:18px}.tile .ph span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.tile{display:block;position:relative}
.tile .im{position:relative;aspect-ratio:3/4;background:var(--card);overflow:hidden;border-radius:16px}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease),opacity .5s}
.tile img.b{opacity:0}
@media(hover:hover){.tile:hover img.a{transform:scale(1.05)}.tile:hover img.b{opacity:1}}
.tile .tag{position:absolute;left:8px;top:8px;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.9);font-size:11px;font-weight:600;color:var(--ink)}
.tile .sw{position:absolute;left:8px;bottom:8px;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.9);font-size:11px;font-weight:500}
.tile .t{margin-top:9px;font-size:13px;font-weight:600;line-height:1.3;padding:0 2px}
.tile .p{margin-top:3px;font-size:13px;color:var(--ink2);padding:0 2px}
.reveal{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.reveal.in{opacity:1;transform:none}
.empty{text-align:center;color:var(--ink2);padding:60px 20px;line-height:1.7}
.empty a{color:var(--ink);text-decoration:underline}
/* бутик */
.bout{margin:44px 10px 0;border-radius:24px;overflow:hidden;position:relative;min-height:380px;display:flex;align-items:flex-end;background:#000;color:#fff}
@media(min-width:900px){.bout{max-width:1260px;margin:56px auto 0}}
.bout img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.55)}
.bout .in{position:relative;padding:22px 18px}
.bout .kicker{color:var(--gold)}
.bout h3{margin:8px 0 6px;font-weight:900;font-size:clamp(34px,10vw,56px);line-height:.9;letter-spacing:-.04em;text-transform:uppercase}
.bout p{margin:0;color:rgba(255,255,255,.85);font-size:14px;line-height:1.5}
.bout .cta.gold{background:#fff;color:#000}
.perks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 10px 0}
@media(min-width:900px){.perks{max-width:1260px;margin:10px auto 0}}
.perk{padding:14px 12px;border-radius:18px;background:var(--bg2);font-size:12px;line-height:1.4;color:var(--ink2)}
.perk b{display:block;color:var(--ink);font-weight:800;font-size:15px;margin-bottom:3px;text-transform:uppercase;letter-spacing:-.01em}
footer{margin-top:48px;background:#0A0A0A;color:rgba(255,255,255,.7);padding:34px 18px calc(110px + env(safe-area-inset-bottom));text-align:center;font-size:13px;line-height:1.9}
footer .logo{display:block;margin-bottom:10px;color:var(--gold);font-size:26px}
footer a{color:#fff}
/* док */
.dock{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:35;display:flex;gap:2px;padding:5px;border-radius:999px;background:rgba(10,10,10,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .4s var(--ease),opacity .3s;color:#fff}
.dock.away{transform:translate(-50%,140%);opacity:0}
.dock a,.dock button{display:flex;align-items:center;gap:7px;height:44px;padding:0 15px;border-radius:999px;border:0;background:none;cursor:pointer;font-size:13px;font-weight:600;color:#fff}
.dock .on{background:#fff;color:#000}
.dock svg{width:19px;height:19px}
.dock .wa{background:var(--gold);color:#0A0A0A}
/* товар */
.pd{padding-top:60px}
@media(min-width:900px){.pd{display:grid;grid-template-columns:1.25fr 1fr;gap:44px;max-width:1280px;margin:0 auto;padding:84px 14px 0;align-items:start}.info{position:sticky;top:84px}}
.gal{position:relative;background:var(--card)}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slides img,.slides video{flex:none;width:100%;aspect-ratio:3/4;object-fit:cover;scroll-snap-align:start;background:#000}
@media(min-width:900px){.gal{background:none}.slides{display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow:visible}.slides img{border-radius:16px}.slides img:first-child,.slides video:first-child{grid-column:span 2;aspect-ratio:4/5}.slides video{border-radius:16px}.slides video+img{grid-column:auto;aspect-ratio:3/4}}
.bars{position:absolute;top:10px;left:12px;right:12px;display:flex;gap:4px;z-index:2}
.bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.45)}
.bars i.on{background:#fff}
@media(min-width:900px){.bars{display:none}}
.gal .bk{position:absolute;top:22px;left:10px;z-index:3;display:flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;border:0;background:rgba(255,255,255,.92);font-size:13px;font-weight:600;cursor:pointer}
@media(min-width:900px){.gal .bk{top:-46px;left:0;background:none;padding:0}}
.info{padding:18px 14px 130px;position:relative;margin-top:-22px;border-radius:22px 22px 0 0;background:var(--bg);z-index:2}
@media(min-width:900px){.info{margin:0;padding:0 0 60px;border-radius:0}}
.info .cat{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.info h1{margin:6px 0 0;font-weight:900;font-size:clamp(28px,8vw,42px);line-height:.95;letter-spacing:-.035em;text-transform:uppercase}
.code{margin-top:8px;font-size:12px;color:var(--ink2)}
.price{margin-top:12px;font-weight:800;font-size:26px;letter-spacing:-.02em}
.note{font-size:12px;color:var(--ink2);margin-top:6px;line-height:1.5}
.lbl{margin:22px 0 10px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);display:flex;justify-content:space-between;align-items:center}
.lbl button{border:0;background:none;padding:0;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;min-height:32px;text-decoration:underline;text-underline-offset:4px}
.colors{display:flex;flex-wrap:wrap;gap:6px}
.color{display:flex;align-items:center;gap:8px;border:1.5px solid transparent;background:var(--bg2);padding:4px 14px 4px 4px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;min-height:44px}
.color img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.color .nx{width:34px;height:34px;border-radius:50%;background:var(--card)}
.color.on{border-color:var(--ink);background:#fff}
.sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.size{position:relative;border:0;background:var(--bg2);height:50px;border-radius:14px;cursor:pointer;font-size:15px;font-weight:600;transition:all .2s var(--ease)}
.size.on{background:var(--ink);color:#fff}
.size.out{color:#BDBDB8;cursor:not-allowed;text-decoration:line-through}
.asia{margin-top:10px;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--bg2);font-size:13px;line-height:1.5;color:var(--ink2)}
.asia b{color:var(--ink);font-weight:600}
.asia svg{flex:none;width:18px;height:18px;margin-top:1px;color:var(--gold)}
.desc{margin-top:20px;font-size:14px;line-height:1.7;color:var(--ink2);white-space:pre-line}
.shop{margin-top:18px;padding:14px;border-radius:14px;background:var(--bg2);font-size:13px;line-height:1.7;color:var(--ink2)}
.buy{position:fixed;left:0;right:0;bottom:0;z-index:36;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
@media(min-width:900px){.buy{position:static;background:none;border:0;padding:0;margin-top:20px}}
.buy .bp{flex:none;font-weight:800;font-size:19px;padding:0 4px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:transform .2s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--bg2);color:var(--ink);margin-top:10px}
.btn svg{width:18px;height:18px;color:var(--gold)}
.hint{text-align:center;font-size:12px;color:var(--ink2);margin-top:10px}
.more{margin-top:36px}
/* окно */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.veil{align-items:center}}
.sheet{width:100%;max-width:480px;max-height:92vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:24px 18px calc(22px + env(safe-area-inset-bottom));animation:sh .4s var(--ease)}
@media(min-width:700px){.sheet{border-radius:24px}}
@keyframes sh{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:0 0 6px;font-weight:900;font-size:28px;letter-spacing:-.03em;text-transform:uppercase}
.sheet .sub{font-size:13px;color:var(--ink2);margin-bottom:14px;line-height:1.5}
.fld{display:block;margin-top:10px}
.fld span{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.fld input{width:100%;border:1.5px solid var(--line);background:#fff;padding:14px;font-size:16px;border-radius:14px;outline:none}
.fld input:focus{border-color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.err{margin-top:10px;color:#C0392B;font-size:13px}
.close{float:right;border:0;background:var(--bg2);width:36px;height:36px;border-radius:50%;margin:-6px -4px 0 0;cursor:pointer;font-size:18px}
.res{margin-top:14px;padding:14px;border-radius:14px;background:var(--bg2);font-size:15px;line-height:1.5}
.nophoto{display:flex;align-items:center;justify-content:center;text-align:center;aspect-ratio:3/4;width:100%;background:var(--card);color:var(--ink2);font-size:14px;line-height:1.6;padding:24px}
/* избранное */
.fav{position:absolute;right:8px;top:8px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);transition:transform .3s var(--ease)}
.fav svg{width:17px;height:17px}
.fav.on{color:#D6334A}.fav.on svg{fill:currentColor}
.fav.pop{animation:pop .45s var(--ease)}
@keyframes pop{40%{transform:scale(1.35)}}
.info .fav{position:static;width:44px;height:44px;background:var(--bg2);flex:none}
.ttl{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
/* Reels */
.reelbtn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.reelbtn svg{width:11px;height:11px;color:var(--gold)}
.reels{position:fixed;inset:0;z-index:70;background:#000;color:#fff;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.reels::-webkit-scrollbar{display:none}
.reel{position:relative;height:100svh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden}
.reel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reel.on img.cur{animation:kb 7s linear forwards}
.reel:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.4),rgba(0,0,0,0) 22%,rgba(0,0,0,0) 55%,rgba(0,0,0,.8));pointer-events:none}
.reel .pb{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;right:60px;z-index:3;display:flex;gap:4px}
.reel .pb i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
.reel .pb i.done{background:#fff}
.reel .pb i.cur:after{content:"";display:block;height:100%;background:#fff;transform-origin:left;animation:fillx 3.5s linear forwards}
.reel .tap{position:absolute;top:0;bottom:30%;width:35%;z-index:2}
.reel .tap.l{left:0}.reel .tap.r{right:0}
.reel .meta{position:absolute;left:16px;right:84px;bottom:calc(26px + env(safe-area-inset-bottom));z-index:3}
.reel .meta .cat{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.reel .meta h3{margin:6px 0 4px;font-weight:900;font-size:30px;line-height:.92;letter-spacing:-.03em;text-transform:uppercase}
.reel .meta .pr{font-weight:700;font-size:18px}
.reel .meta .cl{margin-top:4px;font-size:12px;color:rgba(255,255,255,.75)}
.reel .meta .go{margin-top:12px;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;background:#fff;color:#000;font-size:14px;font-weight:600}

      <div class="asia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg><div>${shoes?"<b>Размеры обуви — европейская сетка (EU).</b> Сомневаетесь в размере — напишите нам, подскажем.":"<b>Азиатский стандарт — маломерит.</b> Если сомневаетесь, нажмите «Подобрать размер» или возьмите на размер больше."}</div></div>`}
      <div class="buy"><span class="bp">${fmt(price)}</span><a class="btn" id="waAsk" target="_blank" rel="noopener" href="#">${ICON_WA}Заказать</a></div>

      ${(() => { const d = duoFor(p); if (!d.length) return ""; const top = TOPS.test(p.type); return `<div class="duo"><h4>Соберите двойку</h4><div class="sub">${top?"К этому верху подойдут штаны":"К этим штанам подойдёт верх"} — продаются отдельно, можно заказать вместе.</div><div class="opts">${d.map((x,i)=>`<button class="opt ${i?"":"on"}" data-k="${esc(x.key)}"><img loading="lazy" src="${esc(x.pics[0]||x.img)}" alt=""><span>${esc(x.title)}</span><b>${fmt(x.price)}</b></button>`).join("")}</div><div class="sum"><span>Комплект</span><b id="duoSum">${fmt(price + d[0].price)}</b></div><a class="btn" id="duoGo" target="_blank" rel="noopener" href="#">${ICON_WA}Заказать двойку</a></div>`; })()}
      ${p.desc?`<div class="desc">${esc(p.desc)}</div>`:""}
      <div class="shop">Примерка и покупка в бутике: ТРЦ Riviera Park, 1 этаж, 10:00–22:00.<br>Доставка по Алматы в день заказа, по Казахстану — Казпочта и СДЭК.</div>
    </div>
  </div>
  ${similar.length?`<section class="more"><div class="sh"><h2>Вам может <em>понравиться</em></h2></div><div class="rail">${similar.map(x => tile(x)).join("")}</div></section>`:""}`;
  const askText = `Здравствуйте! Хочу заказать с сайта:\n${p.title}\nЦвет: ${c.name||"—"}${one?"":`\nРазмер: ${state.size||"подскажите"}`}\nЦена: ${fmtT(price)}${SALE_ON?` (со скидкой 11.11 −${SALE.pct}%)`:""}${fee()?` + ${fmtT(fee())} конвертация = ${fmtT(price + fee())}`:""}${cur!=="KZT"?` (≈ ${fmt(price)})`:""}\n${location.href}`;
  $("#waAsk").href = wa(askText);
  $("#waAsk").onclick = function(){ const o = rid(4).toUpperCase(); this.href = wa(askText + "\nКод заказа: " + o); track({ t: "wa", k: p.key, n: p.title, c: c.name || "", z: one ? "" : (state.size || ""), p: price, o }); flush(); };
  if ($("#duoGo")) { let pick = duoFor(p)[0];
    const upd = () => { $("#duoSum").textContent = fmtMany(price, pick.price); $("#duoGo").href = wa(`Здравствуйте! Хочу заказать двойку с сайта:\n1) ${p.title}, цвет ${c.name||"—"}, размер ${state.size||"подскажите"} — ${fmtT(price)}\n2) ${pick.title} — ${fmtT(pick.price)} (размер подскажите)\nИтого: ${fmtT(price + pick.price + 2*fee())}${fee()?` (вкл. ${fmtT(2*fee())} конвертация)`:""}${cur!=="KZT"?` ≈ ${fmtMany(price, pick.price)}`:""}`); };
    document.querySelectorAll(".duo .opt").forEach(b => b.onclick = () => { buzz(); pick = PRODUCTS.find(x => x.key === b.dataset.k); document.querySelectorAll(".duo .opt").forEach(x => x.classList.toggle("on", x === b)); upd(); });
    upd(); $("#duoGo").addEventListener("click", function(){ const o = rid(4).toUpperCase(); this.href += encodeURIComponent("\nКод заказа: " + o); track({ t: "wa", k: p.key, n: p.title + " + " + pick.title, c: c.name||"", z: state.size||"", p: price + pick.price, o }); flush(); }); }
  $("#back").onclick = () => { history.length > 1 && document.referrer.includes(location.host) ? history.back() : (location.hash = ""); };
  if ($("#fit")) $("#fit").onclick = () => fitSheet(p, c);
  document.querySelectorAll(".color").forEach(b => b.onclick = () => { state.color = +b.dataset.i; state.size = null; const y = scrollY; product(p); scrollTo(0, y); });
  document.querySelectorAll(".size:not(.out)").forEach(b => b.onclick = () => { buzz(); state.size = b.dataset.s; const y = scrollY; product(p); scrollTo(0, y); });
  const sl = $("#slides"), br = $("#bars");
  if (sl) sl.querySelectorAll("video").forEach(v => { v.muted = true; v.play().catch(() => {}); });
  if (sl && br) sl.addEventListener("scroll", () => { const i = Math.round(sl.scrollLeft / sl.clientWidth); br.querySelectorAll("i").forEach((d,k)=>d.classList.toggle("on",k<=i)); }, {passive:true});
}
function openSheet(html){ $("#sheet").innerHTML = `<button class="close" aria-label="Закрыть" onclick="closeSheet()">×</button>` + html; $("#veil").classList.remove("hidden"); }
function closeSheet(){ $("#veil").classList.add("hidden"); }
$("#veil").addEventListener("click", e => { if (e.target.id === "veil") closeSheet(); });

function suggest(h, w){
  if (!w) return null;
  if (w < 74) return { main: "M", text: "Вам подойдёт <b>M</b>." };
  if (w <= 76) return { main: "M", text: "Вы на границе: <b>M</b> — по фигуре, <b>L</b> — свободнее. Лучше примерить оба в бутике или напишите нам." };
  if (w <= 85) return { main: "L", text: "Вам подойдёт <b>L</b>." };
  return { main: "XL", text: "Скорее <b>XL</b>, но лучше уточнить у консультанта в WhatsApp — посадка зависит от модели." };
}
function fitSheet(p, c){
  openSheet(`<h2>Подбор размера</h2><div class="sub">Размеры по азиатскому стандарту, они меньше европейских. Ориентир: модель 175 см / 70 кг носит M или L.</div>
  <div class="row"><label class="fld"><span>Рост, см</span><input id="fh" inputmode="numeric" placeholder="175"></label><label class="fld"><span>Вес, кг</span><input id="fw" inputmode="numeric" placeholder="72"></label></div>
  <button class="btn" id="fgo" style="width:100%">Подобрать</button><div id="fres"></div>`);
  $("#fgo").onclick = () => {
    const r = suggest(+$("#fh").value, +$("#fw").value);
    if (!r){ $("#fres").innerHTML = `<div class="err">Укажите вес.</div>`; return; }
    const has = c.sizes.find(s => s.s === r.main && s.qty > 0);
    $("#fres").innerHTML = `<div class="res">${r.text}${has?"":`<br><small>Размера ${r.main} в этом цвете сейчас нет — напишите нам, подберём альтернативу.</small>`}</div>${has?`<button class="btn ghost" id="fpick" style="width:100%">Выбрать ${r.main}</button>`:""}`;
    if (has) $("#fpick").onclick = () => { state.size = r.main; closeSheet(); product(p); };
  };
}

/* шапка и док при прокрутке */
let lastY = 0;
addEventListener("scroll", () => {
  const y = scrollY, h = $("#hdr"), d = $("#dock"), pdp = document.body.classList.contains("pdp");
  h.classList.toggle("solid", y > 40 || pdp);
  h.classList.toggle("up", y > 300 && y > lastY + 4);
  if (y < lastY - 4 || y < 300) h.classList.remove("up");
  d.classList.toggle("away", pdp || (y > 300 && y > lastY + 4));
  if (!pdp && (y < lastY - 4 || y < 300)) d.classList.remove("away");
  lastY = y;
}, { passive: true });
$("#srchTop").onclick = () => { if (location.hash) { location.hash = ""; setTimeout(() => $("#q") && $("#q").focus(), 350); } else { $("#cat").scrollIntoView({ behavior: "smooth" }); setTimeout(() => $("#q").focus({ preventScroll: true }), 500); } };
$("#dReels").onclick = () => openReels(0);
$("#dHome").onclick = e => { e.preventDefault(); if (location.hash) location.hash = ""; else $("#cat").scrollIntoView({ behavior: "smooth" }); };

function curSheet(){
  openSheet(`<h2>Валюта</h2><div class="sub">Цены пересчитываются по курсу Национального банка РК${RATES.date?" на "+esc(RATES.date):""}. Оплата — в тенге. Для рублей, долларов и евро к каждой вещи добавляется ${fmtT(FX_FEE)} за конвертацию; для тенге, сомов и сумов — без доплаты.</div><div class="curs">${Object.entries(CUR).map(([k,v]) => `<button class="${k===cur?"on":""}" data-c="${k}"><b>${v.s}</b>${v.n}</button>`).join("")}</div>`);
  document.querySelectorAll(".curs button").forEach(b => b.onclick = () => { cur = b.dataset.c; try { localStorage.setItem("a_cur", cur); } catch(e) {} buzz(); closeSheet(); $("#curBtn").textContent = CUR[cur].s; track({ t: "cur", n: cur }); const y = scrollY; render(); scrollTo(0, y); });
}
$("#curBtn").textContent = CUR[cur].s;
$("#curBtn").onclick = curSheet;
let lastView = "", listY = 0;
/* Плавный переход между экранами. Если браузер (Instagram, iPhone, свёрнутая вкладка) не запускает переход — рисуем сразу, без анимации. Первый показ всегда сразу. */
let vtFirst = true;
function vt(go){
  if (vtFirst || !document.startViewTransition || document.hidden) { vtFirst = false; go(); return; }
  let done = false; const run = () => { if (done) return; done = true; try { go(); } catch (e) { console.error(e); } };
  let t = null; try { t = document.startViewTransition(run); t.finished.catch(() => {}); } catch (e) { run(); }
  setTimeout(() => { if (!done) { try { t && t.skipTransition(); } catch (e) {} run(); } }, 250);
}
function render(){
  if (location.hash === "#c=great-steppe") { const go = () => { lastView = ""; gsPage(); scrollTo(0,0); $("#hdr").classList.add("solid"); $("#dock").classList.remove("away"); track({ t: "view", k: "great-steppe", n: "Коллекция The Great Steppe" }); }; vt(go); return; }
  const m = location.hash.match(/^#p=(.+)$/);
  const p = m && PRODUCTS.find(x => x.key === decodeURIComponent(m[1]));
  const go = () => {
    if (p) { product(p); scrollTo(0, 0); if (lastView !== p.key) { lastView = p.key; track({ t: "view", k: p.key, n: p.title }); } }
    else { lastView = ""; list(); scrollTo(0, listY); }
    $("#hdr").classList.toggle("solid", !!p || scrollY > 40);
    $("#dock").classList.toggle("away", !!p);
  };
  vt(go);
}
addEventListener("hashchange", () => { if (!document.body.classList.contains("pdp")) listY = scrollY; state.color = 0; state.size = null; render(); });
render();
/* iOS (энергосбережение, браузер Instagram) не даёт видео запускаться само и рисует кнопку ▶.
   Пока видео не играет — показываем вместо него картинку-обложку; при первом касании запускаем видео. */
function vidFallback(v){
  if (v.dataset.fb || !v.paused) return; v.dataset.fb = 1;
  const src = v.getAttribute("poster"); v.style.display = "none";
  if (src) { const im = document.createElement("img"); im.src = src; im.alt = ""; im.className = v.className; im.dataset.vfb = 1; v.before(im); v._fb = im; }
}
function kickVideos(gesture){
  document.querySelectorAll("video[autoplay]").forEach(v => {
    v.muted = true; v.playsInline = true; v.setAttribute("playsinline", ""); v.removeAttribute("controls");
    if (!v.dataset.w) { v.dataset.w = 1; v.addEventListener("playing", () => { v.style.display = ""; if (v._fb) { v._fb.remove(); v._fb = null; } delete v.dataset.fb; }); }
    if (v.paused) { const pr = v.play(); if (pr && pr.catch) pr.catch(() => vidFallback(v)); if (!gesture) setTimeout(() => { if (v.paused) vidFallback(v); }, 700); }
  });
}
["touchstart","pointerdown","click"].forEach(ev => addEventListener(ev, () => kickVideos(true), { passive: true }));
addEventListener("scroll", () => kickVideos(false), { passive: true });
let kvT; new MutationObserver(() => { clearTimeout(kvT); kvT = setTimeout(() => kickVideos(false), 120); }).observe(document.documentElement, { childList: true, subtree: true });
kickVideos(false);
/* Таймер акции до полуночи по Алматы */
setInterval(() => { const e = document.getElementById("saleCd"); if (!e || !SALE_ON) return; const end = SALE_EXT ? SALE.until : SALE.ext; let d = Math.max(0, end - Date.now()) / 1000; const h = Math.floor(d/3600), m = Math.floor(d%3600/60), sc = Math.floor(d%60); e.textContent = "до конца " + [h,m,sc].map(x => String(x).padStart(2,"0")).join(":"); }, 1000);
/* Приложение ACTUAL: установка на экран «Домой» (iPhone — через «Поделиться», Android — кнопкой) */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
(() => {
  const ua = navigator.userAgent, standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  const inApp = /Instagram|FBAN|FBAV|TikTok|WhatsApp/i.test(ua), ios = /iPhone|iPad/.test(ua);
  let seen = false; try { seen = localStorage.getItem("a_inst") === "1"; } catch (e) {}
  if (standalone || inApp || seen) return;
  let defer = null; addEventListener("beforeinstallprompt", e => { e.preventDefault(); defer = e; });
  setTimeout(() => {
    if (!ios && !defer) return;
    const d = document.createElement("div"); d.className = "inst";
    d.innerHTML = `<img src="/app/icon-180.png" alt=""><div><b>Приложение ACTUAL</b><span>${ios ? "Нажмите «Поделиться» ⬆︎ и «На экран Домой»" : "Установите — каталог будет под рукой"}</span></div>${ios ? "" : `<button class="cta gold" id="instGo" style="padding:10px 14px">Установить</button>`}<button class="x" aria-label="Закрыть">×</button>`;
    document.body.appendChild(d); requestAnimationFrame(() => d.classList.add("on"));
    const close = () => { d.classList.remove("on"); setTimeout(() => d.remove(), 400); try { localStorage.setItem("a_inst", "1"); } catch (e) {} };
    d.querySelector(".x").onclick = close;
    const g = d.querySelector("#instGo"); if (g) g.onclick = () => { defer.prompt(); defer.userChoice.finally(close); };
  }, 25000);
})();
